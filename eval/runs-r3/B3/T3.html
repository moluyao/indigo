<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AURA ONE · 6s</title>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0D0E11; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function () {
  const W = 1080, H = 1920, DUR = 6000;
  const ctx = document.getElementById('c').getContext('2d');
  const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  const LAT = '"Segoe UI","Helvetica Neue",Arial,sans-serif';
  const COPPER = '#FF7A45', CREAM = '#EFE8DC', INK = '#F3EEE6';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eBack = p => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const lerp = (a, b, p) => a + (b - a) * p;
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(1128);
  const NOISE = []; for (let i = 0; i < 2048; i++) NOISE.push(rnd() * 2 - 1);
  const grain = []; for (let i = 0; i < 160; i++) grain.push({ x: rnd() * W, y: rnd() * H, a: rnd() * .5 + .1, r: rnd() * 1.4 + .4 });

  function txt(s, x, y, size, color, weight, align, font, ls) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + (font || FONT);
    ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
    if (ls) { try { ctx.letterSpacing = ls + 'px'; } catch (e) {} }
    ctx.fillText(s, x, y);
    if (ls) { try { ctx.letterSpacing = '0px'; } catch (e) {} }
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function glow(x, y, r, color, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  }

  // ---------- waveform: noise -> silence -> music ----------
  const LINE_Y = 1010;
  function waveform(t) {
    const quiet = eIO(prog(t, 1250, 2300));        // noise cancelled
    const music = eIO(prog(t, 2600, 3600));        // gentle music line comes in
    const scroll = Math.floor(t * 0.12);
    ctx.save();
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let x = 70; x <= W - 70; x += 6) {
        const i = (x / 6 + scroll) | 0;
        const n = NOISE[i % 2048] * 0.65 + NOISE[(i * 7 + 13) % 2048] * 0.35;
        const env = Math.sin(Math.PI * (x - 70) / (W - 140));
        const noisy = n * 120 * env * (1 - quiet);
        const smooth = Math.sin((x * 0.018) - t * 0.006) * 26 * env * music;
        const y = LINE_Y + noisy + smooth;
        x === 70 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      if (pass === 0) { ctx.strokeStyle = 'rgba(255,122,69,.18)'; ctx.lineWidth = 14; }
      else {
        ctx.strokeStyle = quiet < 1 ? 'rgba(243,238,230,' + (0.55 + 0.1 * (1 - quiet)) + ')' : 'rgba(255,150,105,.85)';
        if (music > 0) ctx.strokeStyle = 'rgba(' + Math.round(lerp(243, 255, music)) + ',' + Math.round(lerp(238, 140, music)) + ',' + Math.round(lerp(230, 95, music)) + ',.85)';
        ctx.lineWidth = 3;
      }
      ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- headphones (front view, local coords) ----------
  function cup(side, sheen) {
    const cx = side * 300, cy = 170, w = 190, h = 290;
    // inner cushion, facing the other cup
    ctx.fillStyle = '#26221F';
    rr(cx - side * 62 - 48, cy - h * .45, 96, h * .9, 48); ctx.fill();
    // shell
    const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    if (side < 0) { g.addColorStop(0, '#B9AF9F'); g.addColorStop(.55, '#EDE6DA'); g.addColorStop(1, '#F7F2EA'); }
    else { g.addColorStop(0, '#F7F2EA'); g.addColorStop(.45, '#EDE6DA'); g.addColorStop(1, '#B9AF9F'); }
    ctx.fillStyle = g; rr(cx - w / 2 + side * 14, cy - h / 2, w, h, w / 2); ctx.fill();
    // cap seam + copper ring
    ctx.strokeStyle = 'rgba(60,50,40,.18)'; ctx.lineWidth = 3;
    rr(cx - w / 2 + side * 14 + 18, cy - h / 2 + 18, w - 36, h - 36, (w - 36) / 2); ctx.stroke();
    ctx.strokeStyle = COPPER; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(cx + side * 14, cy, 30, 30, 0, 0, 7); ctx.stroke();
    // moving sheen (rim light sweep)
    if (sheen > 0 && sheen < 1) {
      ctx.save();
      rr(cx - w / 2 + side * 14, cy - h / 2, w, h, w / 2); ctx.clip();
      const sy = lerp(cy - h, cy + h, sheen);
      const sg = ctx.createLinearGradient(0, sy - 60, 0, sy + 60);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(cx - w, sy - 60, w * 2, 120);
      ctx.restore();
    }
  }
  function headphones(sheen) {
    // band
    ctx.lineCap = 'round';
    const bg = ctx.createLinearGradient(0, -300, 0, 0);
    bg.addColorStop(0, '#FBF7F0'); bg.addColorStop(1, '#C8BEAE');
    ctx.strokeStyle = bg; ctx.lineWidth = 56;
    ctx.beginPath(); ctx.arc(0, 40, 300, Math.PI * 1.07, Math.PI * 1.93); ctx.stroke();
    ctx.strokeStyle = '#2B2723'; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.arc(0, 40, 262, Math.PI * 1.16, Math.PI * 1.84); ctx.stroke();
    // copper sliders
    [-1, 1].forEach(s => {
      ctx.strokeStyle = COPPER; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(s * 296, -16); ctx.lineTo(s * 306, 40); ctx.stroke();
      ctx.strokeStyle = '#3A332D'; ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(s * 306, 30); ctx.lineTo(s * 310, 46); ctx.stroke();
    });
    cup(-1, sheen); cup(1, sheen);
  }

  // ---------- scene ----------
  function render(ms) {
    const t = clamp(ms, 0, DUR);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    // background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0B0C0F'); bg.addColorStop(.55, '#15140F'); bg.addColorStop(1, '#0B0C0F');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const calm = eIO(prog(t, 1250, 2400));
    glow(W / 2, 1000, 760, 'rgba(255,122,69,.20)', .35 + .65 * calm);
    ctx.save(); ctx.fillStyle = '#fff';
    grain.forEach(g => { ctx.globalAlpha = g.a * .25; ctx.fillRect(g.x, g.y, g.r, g.r); });
    ctx.restore();

    // camera push at the end
    const push = 1 + .035 * eIO(prog(t, 4300, 6000));
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(push, push); ctx.translate(-W / 2, -H / 2);

    waveform(t);

    // headphones drop in
    const pd = prog(t, 550, 1350);
    if (pd > 0) {
      const y = lerp(-420, 840, eBack(pd));
      const float = Math.sin(Math.max(0, t - 1350) * 0.0022) * 8 * prog(t, 1350, 1900);
      const sc = lerp(.86, 1, eOut(pd)) * .96;
      // landing pulse
      const pp = prog(t, 1250, 2000);
      if (pp > 0 && pp < 1) {
        ctx.save(); ctx.globalAlpha = (1 - pp) * .6; ctx.strokeStyle = COPPER; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(W / 2, 1010, 200 + pp * 420, 40 + pp * 90, 0, 0, 7); ctx.stroke(); ctx.restore();
      }
      // floor shadow
      ctx.save(); ctx.globalAlpha = .55 * eOut(pd);
      const sg = ctx.createRadialGradient(W / 2, 1220, 0, W / 2, 1220, 380);
      sg.addColorStop(0, 'rgba(0,0,0,.8)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(W / 2, 1220, 380, 50, 0, 0, 7); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(W / 2, y + float); ctx.scale(sc, sc);
      headphones(prog(t, 2500, 3500));
      ctx.restore();
    }
    ctx.restore();

    // ---- top: dB meter -> headline ----
    const meterIn = eOut(prog(t, 0, 400)), meterOut = prog(t, 2500, 2850);
    if (meterOut < 1) {
      ctx.save(); ctx.globalAlpha = meterIn * (1 - meterOut);
      const db = Math.round(lerp(87, 42, eIO(prog(t, 1250, 2300))));
      const jitter = t < 1250 ? Math.round(NOISE[(Math.floor(t / 70)) % 2048] * 3) : 0;
      const col = t < 1300 ? INK : COPPER;
      txt(String(db + jitter), W / 2 - 40, 520, 230, col, 800, 'center', LAT);
      txt('dB', W / 2 + 150, 520, 64, col, 700, 'left', LAT);
      const lab = prog(t, 1300, 1500);
      ctx.globalAlpha = meterIn * (1 - meterOut) * (1 - lab);
      txt('早高峰地铁车厢', W / 2, 300, 40, 'rgba(243,238,230,.7)', 500);
      ctx.globalAlpha = meterIn * (1 - meterOut) * lab;
      txt('戴上，降噪开启', W / 2, 300, 40, 'rgba(255,170,130,.95)', 600);
      ctx.restore();
    }
    const hIn = eOut(prog(t, 2750, 3350));
    if (hIn > 0) {
      ctx.save(); ctx.globalAlpha = hIn;
      txt('把世界，', W / 2, 330 + (1 - hIn) * 30, 112, INK, 900);
      txt('调成静音。', W / 2, 465 + (1 - hIn) * 30, 112, INK, 900);
      ctx.fillStyle = COPPER; ctx.fillRect(W / 2 - 40, 505 + (1 - hIn) * 30, 80 * hIn, 6);
      ctx.restore();
    }

    // ---- bottom: three specs ----
    const specs = [['−45', 'dB', '主动降噪'], ['40', 'h', '超长续航'], ['360°', '', '空间音频']];
    specs.forEach((s, i) => {
      const p = eOut(prog(t, 3300 + i * 160, 3800 + i * 160));
      if (p <= 0) return;
      const cx = 70 + 940 / 6 + i * 940 / 3, y = 1420 + (1 - p) * 40;
      ctx.save(); ctx.globalAlpha = p;
      ctx.font = '800 84px ' + LAT; const w1 = ctx.measureText(s[0]).width;
      ctx.font = '700 36px ' + LAT; const w2 = ctx.measureText(s[1]).width;
      const x0 = cx - (w1 + w2 + 6) / 2;
      txt(s[0], x0, y, 84, INK, 800, 'left', LAT);
      txt(s[1], x0 + w1 + 6, y, 36, COPPER, 700, 'left', LAT);
      txt(s[2], cx, y + 62, 34, 'rgba(243,238,230,.66)', 500);
      if (i > 0) { ctx.fillStyle = 'rgba(243,238,230,.16)'; ctx.fillRect(70 + i * 940 / 3, y - 70, 2, 150); }
      ctx.restore();
    });

    // ---- brand lockup ----
    const pb = eOut(prog(t, 4300, 4900));
    if (pb > 0) {
      ctx.save(); ctx.globalAlpha = pb;
      ctx.fillStyle = 'rgba(243,238,230,.16)'; ctx.fillRect(70, 1600, 940, 2);
      txt('AURA ONE', W / 2, 1720 + (1 - pb) * 24, 92, INK, 800, 'center', LAT, 14);
      const pw = 300, ph = 64, px = W / 2 - pw / 2, py = 1764 + (1 - pb) * 24;
      ctx.fillStyle = COPPER; rr(px, py, pw, ph, 32); ctx.fill();
      txt('11.28  全面开售', W / 2, py + 44, 32, '#1A120D', 800);
      ctx.restore();
    }
    // top brand mark (small, from the start)
    ctx.save(); ctx.globalAlpha = .7 * prog(t, 0, 300) * (1 - prog(t, 4300, 4700));
    txt('AURA ONE · 头戴式降噪耳机', W / 2, 140, 28, 'rgba(243,238,230,.75)', 600, 'center', FONT, 4);
    ctx.restore();
  }

  let paused = false, t0 = null;
  function loop(now) {
    if (paused) return;
    if (t0 === null) t0 = now;
    const el = now - t0;
    render(Math.min(el, DUR));
    if (el < DUR) requestAnimationFrame(loop);
  }
  window.__seek = function (ms) { paused = true; render(ms); };
  window.__duration = DUR;
  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
