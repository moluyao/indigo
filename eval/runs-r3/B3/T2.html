<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>为什么天空是蓝色的</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0B1530; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function () {
  const W = 1920, H = 1080, DUR = 15000;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  const NUM = '"Segoe UI","Helvetica Neue",Arial,sans-serif';

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const lerp = (a, b, p) => a + (b - a) * p;
  function mix(c1, c2, p) {
    return 'rgb(' + [0, 1, 2].map(i => Math.round(lerp(c1[i], c2[i], p))).join(',') + ')';
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261120);

  const C = {
    navy: '#0B1530', ink: '#F4F1EA', dim: 'rgba(244,241,234,.62)',
    red: '#FF5A4E', orange: '#FF9A3C', yellow: '#FFD84A', green: '#5BD18B',
    blue: '#4FA3FF', violet: '#9B7BFF', sun: '#FFE7A8'
  };

  function text(str, x, y, size, color, weight, align, font) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + (font || FONT);
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(str, x, y);
  }
  // rich: [[str, color], ...]
  function rich(segs, x, y, size, weight, align) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
    let total = 0; segs.forEach(s => total += ctx.measureText(s[0]).width);
    let cx = align === 'center' ? x - total / 2 : x;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    segs.forEach(s => { ctx.fillStyle = s[1]; ctx.fillText(s[0], cx, y); cx += ctx.measureText(s[0]).width; });
  }
  function caption(step, segs, lt, delay) {
    const p = eOut(prog(lt, delay || 0, (delay || 0) + 500));
    ctx.save(); ctx.globalAlpha *= p;
    const dy = (1 - p) * 24;
    ctx.fillStyle = C.blue; ctx.fillRect(120, 118 + dy, 54, 6);
    text(step, 188, 128 + dy, 26, C.blue, 800, 'left', NUM);
    rich(segs, 120, 212 + dy, 56, 800);
    ctx.restore();
  }
  function wave(x0, x1, y, lambda, amp, phase, color, lw, alpha) {
    if (x1 <= x0) return;
    ctx.save(); ctx.globalAlpha *= (alpha == null ? 1 : alpha);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = x0; x <= x1; x += 3) {
      const yy = y + amp * Math.sin(2 * Math.PI * (x - phase) / lambda);
      x === x0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke(); ctx.restore();
  }
  function glow(x, y, r, color, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function darkBg() {
    const g = ctx.createRadialGradient(W * .5, H * .55, 100, W * .5, H * .55, 1200);
    g.addColorStop(0, '#13234A'); g.addColorStop(1, '#070E22');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ---------- precomputed (seeded) data ----------
  const field = []; // background molecules for scene 3
  for (let i = 0; i < 70; i++) field.push({ x: rnd() * W, y: 280 + rnd() * 700, r: 2 + rnd() * 2.5, ph: rnd() * 6.28 });
  const skyMol = []; // molecules in sky for scene 4
  const spots = [[260, 520], [430, 340], [620, 610], [760, 300], [900, 470], [1080, 260], [1420, 300], [1580, 470], [1720, 250], [1650, 640], [520, 760], [1000, 700]];
  spots.forEach((s, i) => skyMol.push({ x: s[0], y: s[1], t0: 500 + i * 140 }));
  const dust = [];
  for (let i = 0; i < 90; i++) dust.push({ x: rnd() * W, y: 60 + rnd() * 800, r: 1.2 + rnd() * 1.8 });

  // ---------- scene 1: the question (0–3s) ----------
  function scene1(lt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1F5FCC'); g.addColorStop(.62, '#6FA8EC'); g.addColorStop(1, '#CFE4F7');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun
    const sy = 250 - eOut(prog(lt, 0, 1500)) * 30;
    glow(1530, sy, 420, 'rgba(255,240,200,.55)', 1);
    ctx.fillStyle = '#FFF6DC'; ctx.beginPath(); ctx.arc(1530, sy, 86, 0, Math.PI * 2); ctx.fill();
    // soft cloud bands
    ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = '#fff';
    const drift = lt * .012;
    [[260, 820, 1], [900, 900, .8], [1500, 840, 1.1]].forEach(c => {
      const x = c[0] + drift, y = c[1], s = c[2];
      ctx.beginPath();
      ctx.ellipse(x, y, 190 * s, 40 * s, 0, 0, 7); ctx.ellipse(x + 90 * s, y - 30 * s, 110 * s, 46 * s, 0, 0, 7);
      ctx.ellipse(x - 80 * s, y - 18 * s, 90 * s, 36 * s, 0, 0, 7); ctx.fill();
    });
    ctx.restore();
    // title
    const p = eOut(prog(lt, 0, 700));
    ctx.save(); ctx.globalAlpha *= p;
    ctx.shadowColor = 'rgba(10,30,80,.35)'; ctx.shadowBlur = 30;
    text('天空为什么是', 160, 470 + (1 - p) * 40, 132, '#FFFFFF', 900);
    ctx.font = '900 132px ' + FONT; const w = ctx.measureText('天空为什么是').width;
    text('蓝色', 160 + w, 470 + (1 - p) * 40, 132, '#FFE27A', 900);
    const w2 = ctx.measureText('蓝色').width;
    text('的？', 160 + w + w2, 470 + (1 - p) * 40, 132, '#FFFFFF', 900);
    ctx.restore();
    const p2 = eOut(prog(lt, 600, 1300));
    ctx.save(); ctx.globalAlpha *= p2;
    text('答案藏在两样东西里：阳光，和空气。', 166, 580 + (1 - p2) * 20, 48, 'rgba(255,255,255,.92)', 600);
    ctx.restore();
  }

  // ---------- scene 2: sunlight is a mix (3.0–6.8s) ----------
  const bands = [
    { c: C.red, nm: 700, name: '红' }, { c: C.orange, nm: 620, name: '橙' }, { c: C.yellow, nm: 580, name: '黄' },
    { c: C.green, nm: 530, name: '绿' }, { c: C.blue, nm: 460, name: '蓝' }, { c: C.violet, nm: 410, name: '紫' }
  ];
  function scene2(lt) {
    darkBg();
    caption('01  阳光', [['阳光看着是白的，其实是', C.ink], ['好几种颜色', C.yellow], ['混在一起', C.ink]], lt, 100);
    const beamY = 640, splitX = 640, endX = 1560;
    // sun on the left
    glow(150, beamY, 260, 'rgba(255,231,168,.6)', 1);
    ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(150, beamY, 70, 0, 7); ctx.fill();
    // white beam
    const pb = eIO(prog(lt, 200, 900));
    const bx = lerp(220, splitX, pb);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,255,255,.8)'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(220, beamY); ctx.lineTo(bx, beamY); ctx.stroke();
    ctx.restore();
    // split into bands
    const ps = prog(lt, 900, 2400);
    const spread = eOut(prog(lt, 900, 1500));
    bands.forEach((b, i) => {
      const yT = 380 + i * 92;
      const y = lerp(beamY, yT, spread);
      const reach = splitX + (endX - splitX) * eOut(ps);
      if (ps <= 0) return;
      // connector from split point
      ctx.save(); ctx.strokeStyle = b.c; ctx.globalAlpha = .55; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(splitX, beamY);
      ctx.bezierCurveTo(splitX + 60, beamY, splitX + 60, y, splitX + 120, y); ctx.stroke(); ctx.restore();
      const lam = b.nm * 0.36;
      const emph = (b.name === '红' || b.name === '蓝');
      wave(splitX + 120, reach, y, lam, 26, lt * 0.18, b.c, emph ? 6 : 4, emph ? 1 : .7);
      // labels
      const pl = eOut(prog(lt, 1700 + i * 80, 2300 + i * 80));
      ctx.save(); ctx.globalAlpha *= pl;
      text(b.name, endX + 40, y + 14, 40, b.c, 800);
      text(b.nm + ' nm', endX + 96, y + 12, 28, 'rgba(244,241,234,.7)', 600, 'left', NUM);
      ctx.restore();
    });
    // wavelength callouts for red & blue
    const pc = eOut(prog(lt, 2500, 3100));
    if (pc > 0) {
      ctx.save(); ctx.globalAlpha *= pc;
      const lr = 700 * .36, lb = 460 * .36;
      // red wavelength bracket
      bracket(splitX + 120 + lr * 1.25, splitX + 120 + lr * 2.25, 380 - 52, C.red, '波长长');
      bracket(splitX + 120 + lb * 1.25, splitX + 120 + lb * 2.25, 380 + 4 * 92 + 64, C.blue, '波长短', true);
      ctx.restore();
    }
  }
  function bracket(x0, x1, y, color, label, below) {
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    const d = below ? -12 : 12;
    ctx.beginPath(); ctx.moveTo(x0, y + d); ctx.lineTo(x0, y); ctx.lineTo(x1, y); ctx.lineTo(x1, y + d); ctx.stroke();
    text(label, (x0 + x1) / 2, below ? y + 44 : y - 16, 30, color, 800, 'center');
  }

  // ---------- scene 3: scattering comparison (6.8–11s) ----------
  function scene3(lt) {
    darkBg();
    // drifting background molecules
    ctx.save();
    field.forEach(m => {
      ctx.globalAlpha = .22; ctx.fillStyle = '#AFC3E8';
      ctx.beginPath(); ctx.arc(m.x + Math.sin(lt * .001 + m.ph) * 6, m.y + Math.cos(lt * .0012 + m.ph) * 5, m.r, 0, 7); ctx.fill();
    });
    ctx.restore();
    caption('02  空气', [['空气分子会把光', C.ink], ['“弹”向四面八方', C.blue], ['——波长越短，弹得越多', C.ink]], lt, 100);
    panel(lt, 120, '红光', C.red, 700, 1, 0);
    panel(lt, 1000, '蓝光', C.blue, 460, 5.4, 1);
  }
  function panel(lt, x, name, color, nm, strength, idx) {
    const pw = 800, top = 300, ph = 560;
    const pIn = eOut(prog(lt, 200 + idx * 150, 800 + idx * 150));
    ctx.save(); ctx.globalAlpha *= pIn;
    ctx.fillStyle = 'rgba(255,255,255,.035)'; roundRect(x, top, pw, ph, 24); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2; roundRect(x, top, pw, ph, 24); ctx.stroke();
    text(name, x + 40, top + 64, 40, color, 800);
    text(nm + ' nm', x + 40 + (name.length * 40) + 18, top + 62, 28, 'rgba(244,241,234,.6)', 600, 'left', NUM);
    const mx = x + pw * .5, my = top + ph * .5 + 20;
    ctx.save();
    ctx.beginPath(); roundRect(x, top, pw, ph, 24); ctx.clip();
    // incoming wave
    const front = x + 30 + (lt - 600) * 0.9;
    const lam = nm * .36;
    const head = Math.min(front, x + pw - 30);
    wave(x + 30, Math.min(head, mx), my, lam, 22, lt * .3, color, 5, 1);
    // straight-through (weaker for blue, almost all for red)
    if (front > mx) {
      const passA = idx === 0 ? .95 : .45;
      wave(mx, Math.min(front, x + pw - 30), my, lam, 22 * (idx === 0 ? .96 : .7), lt * .3, color, 5, passA);
    }
    // scattering rings & rays once the wave arrives
    const tHit = 600 + (mx - x - 30) / 0.9;
    if (lt > tHit) {
      const since = lt - tHit;
      const n = idx === 0 ? 3 : 6;
      for (let k = 0; k < 8; k++) {
        const age = since - k * 260;
        if (age < 0) continue;
        const r = 30 + age * 0.32;
        const a = clamp(1 - r / 360, 0, 1) * (idx === 0 ? .22 : .85);
        ctx.strokeStyle = color; ctx.lineWidth = idx === 0 ? 2 : 4; ctx.globalAlpha = a * pIn;
        ctx.beginPath(); ctx.arc(mx, my, r, 0, 7); ctx.stroke();
      }
      ctx.globalAlpha = pIn;
      const rays = 12;
      const len = clamp(since / 900, 0, 1);
      for (let k = 0; k < rays; k++) {
        const ang = k / rays * Math.PI * 2 + .26;
        const L = (idx === 0 ? 70 : 210) * eOut(len);
        arrow(mx + Math.cos(ang) * 40, my + Math.sin(ang) * 40, mx + Math.cos(ang) * (40 + L), my + Math.sin(ang) * (40 + L), color, idx === 0 ? 2.5 : 4, idx === 0 ? .45 : .95);
      }
      glow(mx, my, idx === 0 ? 70 : 150, color, idx === 0 ? .25 : .55);
    }
    // the molecule
    ctx.globalAlpha = pIn;
    ctx.fillStyle = '#DDE7FF';
    ctx.beginPath(); ctx.arc(mx - 13, my, 17, 0, 7); ctx.arc(mx + 13, my, 17, 0, 7); ctx.fill();
    ctx.restore();
    text('空气分子', mx, my + 72, 24, 'rgba(244,241,234,.75)', 600, 'center');
    // strength bar
    const pb = eOut(prog(lt, 2300 + idx * 250, 3200 + idx * 250));
    const by = top + ph + 54;
    text('散射强度', x, by + 8, 28, 'rgba(244,241,234,.75)', 600);
    const maxW = 560, bw = maxW * (strength / 5.4) * pb;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; roundRect(x + 140, by - 22, maxW, 36, 18); ctx.fill();
    ctx.fillStyle = color; roundRect(x + 140, by - 22, Math.max(bw, 36 * pb), 36, 18); ctx.fill();
    ctx.globalAlpha *= clamp(pb * 2 - .6, 0, 1);
    text(idx === 0 ? '1 倍' : '约 5 倍', x + 140 + Math.max(bw, 36) + 20, by + 9, 34, color, 800);
    ctx.restore();
  }
  function arrow(x0, y0, x1, y1, color, lw, a) {
    const ang = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
    if (L < 4) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(ang) * lw * 2, y1 - Math.sin(ang) * lw * 2); ctx.stroke();
    const s = lw * 3.4;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - Math.cos(ang - .45) * s, y1 - Math.sin(ang - .45) * s);
    ctx.lineTo(x1 - Math.cos(ang + .45) * s, y1 - Math.sin(ang + .45) * s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- scene 4: the whole sky (11–15s) ----------
  function scene4(lt) {
    const pSky = eIO(prog(lt, 300, 2600));
    const g = ctx.createLinearGradient(0, 0, 0, 900);
    g.addColorStop(0, mix([7, 14, 34], [30, 95, 205], pSky));
    g.addColorStop(1, mix([19, 35, 74], [150, 196, 240], pSky));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun upper-left, rays crossing the sky
    const sx = 1770, sy = 140;
    glow(sx, sy, 300, 'rgba(255,240,200,.7)', 1);
    ctx.fillStyle = '#FFF6DC'; ctx.beginPath(); ctx.arc(sx, sy, 64, 0, 7); ctx.fill();
    ctx.save(); ctx.globalAlpha = .18 * (1 - pSky * .5); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
    for (let k = 0; k < 7; k++) {
      const a = .12 + k * .085;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - Math.cos(a) * 2200, sy + Math.sin(a) * 2200); ctx.stroke();
    }
    ctx.restore();
    // tiny dust molecules
    ctx.save(); ctx.globalAlpha = .35 + .25 * pSky; ctx.fillStyle = '#E6EEFF';
    dust.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); });
    ctx.restore();
    // ground
    ctx.fillStyle = '#16251E';
    ctx.beginPath(); ctx.moveTo(0, 920); ctx.bezierCurveTo(500, 880, 1100, 930, 1920, 890); ctx.lineTo(1920, 1080); ctx.lineTo(0, 1080); ctx.fill();
    // observer
    const ex = 1250, ey = 826;
    ctx.fillStyle = '#0C1611';
    ctx.beginPath(); ctx.arc(1262, 838, 24, 0, 7); ctx.fill();
    roundRect(1240, 866, 46, 70, 18); ctx.fill();
    // molecules scatter blue toward the eye
    skyMol.forEach(m => {
      const a = prog(lt, m.t0, m.t0 + 400);
      if (a <= 0) return;
      ctx.save();
      ctx.globalAlpha = a * .9;
      ctx.setLineDash([12, 14]); ctx.lineDashOffset = -lt * 0.09;
      ctx.strokeStyle = '#8FC8FF'; ctx.lineWidth = 3;
      const d = eOut(prog(lt, m.t0, m.t0 + 700));
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(lerp(m.x, ex, d), lerp(m.y, ey, d)); ctx.stroke();
      ctx.restore();
      glow(m.x, m.y, 46, 'rgba(110,180,255,.9)', a);
      ctx.fillStyle = '#E8F2FF'; ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, 7); ctx.fill();
    });
    // eye highlight
    glow(ex, ey, 40, 'rgba(140,200,255,.9)', prog(lt, 900, 1500));

    // captions: first explanation, then the conclusion
    const swap = prog(lt, 2100, 2500);
    ctx.save(); ctx.globalAlpha *= (1 - swap);
    caption('03  天空', [['被弹开的蓝光，从', C.ink], ['天空每个方向', '#9FD0FF'], ['钻进你的眼睛', C.ink]], lt, 100);
    ctx.restore();
    if (swap > 0) {
      const p = eOut(swap);
      ctx.save(); ctx.globalAlpha *= p;
      ctx.fillStyle = 'rgba(6,18,48,.55)'; roundRect(100, 92 + (1 - p) * 20, 1480, 240, 28); ctx.fill();
      rich([['所以天空是', '#FFFFFF'], ['蓝色', '#FFE27A'], ['的：阳光里的蓝光最容易被空气散射', '#FFFFFF']], 840, 200 + (1 - p) * 20, 58, 900, 'center');
      text('这个现象叫「瑞利散射」，散射强度与波长的四次方成反比', 840, 278 + (1 - p) * 20, 32, 'rgba(255,255,255,.82)', 600, 'center');
      ctx.restore();
      const pf = eOut(prog(lt, 2700, 3200));
      ctx.save(); ctx.globalAlpha *= pf;
      text('* 紫光散射得更多，但阳光里紫光本来就少，人眼对紫光也不敏感，所以我们看到的是蓝。', 120, 1020, 28, 'rgba(230,240,235,.78)', 500);
      ctx.restore();
    }
  }

  // ---------- timeline ----------
  const scenes = [
    { a: 0, b: 3000, f: scene1 },
    { a: 3000, b: 6800, f: scene2 },
    { a: 6800, b: 11000, f: scene3 },
    { a: 11000, b: 15000, f: scene4 }
  ];
  const XF = 350;
  function render(ms) {
    const t = clamp(ms, 0, DUR);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = C.navy; ctx.fillRect(0, 0, W, H);
    scenes.forEach((s, i) => {
      const start = i === 0 ? s.a : s.a - XF;
      if (t < start || t > s.b) return;
      const fadeIn = i === 0 ? 1 : prog(t, s.a - XF, s.a);
      ctx.save(); ctx.globalAlpha = eIO(fadeIn);
      s.f(t - s.a + (i === 0 ? 0 : 0));
      ctx.restore();
    });
  }

  let paused = false, t0 = null;
  function loop(now) {
    if (paused) return;
    if (t0 === null) t0 = now;
    const el = now - t0;
    render(Math.min(el, DUR));
    if (el < DUR) requestAnimationFrame(loop);
  }
  window.__seek = function (ms) { paused = true; render(ms); };
  window.__duration = DUR;
  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
