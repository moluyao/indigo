<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>天空为什么是蓝色的</title>
<style>
  html,body{margin:0;padding:0;background:#05070b;overflow:hidden;}
  canvas{display:block;width:1920px;height:1080px;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function(){
const W=1920,H=1080,DUR=15;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif';

// ---- seeded RNG ----
function rng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const R=rng(20261120);

const COL={r:'#ff6a4d',g:'#7fe08a',b:'#a9d6ff'};
const V=900;                 // px per second
const BAND0=405,BAND1=495;   // beam band
const EYE_NOON={x:1500,y:880},EYE_DUSK={x:1770,y:450};
const DUSK_T=10.6;

// ---- molecules ----
const mols=[];
for(let i=0;i<120;i++){mols.push({x:30+R()*1860,y:110+R()*880});}
for(let i=0;i<26;i++){mols.push({x:60+R()*1800,y:BAND0-10+R()*110});}

// ---- photons ----
// scatter probability ∝ 1/λ^4 : blue 450nm, green 550nm, red 700nm
const P_NOON={b:0.85,g:0.38,r:0.15};
const photons=[];
const RATE=70;
for(let i=0;;i++){
  const t0=-2+i/RATE; if(t0>DUR) break;
  const u=R(); const c=u<1/3?'r':(u<2/3?'g':'b');
  const y0=BAND0+R()*(BAND1-BAND0);
  const dusk=t0>=DUSK_T;
  let sc=false,xs=0,dx=0,dy=0,toEye=false,maxd=1e9;
  const a=R(),b=R(),d=R(),e=R();
  if(!dusk){
    if(a<P_NOON[c]){sc=true;xs=80+b*1760;}
  }else{
    const p={b:1.0,g:0.92,r:0.25}[c];
    const rg={b:[60,900],g:[300,1450],r:[500,1700]}[c];
    if(a<p){sc=true;xs=rg[0]+b*(rg[1]-rg[0]);}
  }
  if(sc){
    if(!dusk && d<0.35){
      const tx=EYE_NOON.x+(e-0.5)*40,ty=EYE_NOON.y-10;
      const L=Math.hypot(tx-xs,ty-y0);dx=(tx-xs)/L;dy=(ty-y0)/L;toEye=true;maxd=L-24;
    }else{const ang=e*Math.PI*2;dx=Math.cos(ang);dy=Math.sin(ang);}
  }
  photons.push({t0,c,y0,sc,xs,dx,dy,toEye,maxd,dusk});
}
function pathPos(p,t){ // returns [x,y] or null if not emitted / finished
  const dt=t-p.t0; if(dt<0) return null;
  const x=-40+V*dt;
  if(!p.sc||x<p.xs) return [x,p.y0];
  const ts=(p.xs+40)/V; const d=V*(dt-ts);
  if(d>p.maxd) return null;
  return [p.xs+p.dx*d,p.y0+p.dy*d];
}

// ---- helpers ----
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const dock=x=>{x=clamp(x,0,1);return 1-Math.pow(1-x,3);};
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';}

const CAPS=[
  {t0:0,   t1:3.2, txt:['阳光看着是白的，其实是红、绿、蓝等','各种颜色的光混在一起']},
  {t0:3.2, t1:7.4, txt:['撞上空气分子时，蓝光很容易被弹向四面八方，','红光几乎直穿而过'], note:'蓝光被弹开的机会约是红光的 5 倍多（散射强度 ∝ 1/波长⁴）'},
  {t0:7.4, t1:11.0,txt:['被弹开的蓝光从天上各个方向射进你的眼睛，','所以天是蓝的']},
  {t0:11.0,t1:15.01,txt:['傍晚阳光斜着穿过更厚的空气，蓝光半路就被弹光了，','剩下的红橙光照进眼里']},
];

function draw(t){
  // --- background: sky brightness = amount of scattered light ---
  const kb=ease((t-2.6)/6.0);           // noon blue builds up
  const kd=ease((t-11.0)/2.2);          // dusk
  const noon=mix('#05070b','#1f4f95',kb);
  if(kd<=0){ctx.fillStyle=noon;ctx.fillRect(0,0,W,H);}
  else{
    const left=mix('#1f4f95','#1b3f78',kd), right=mix('#1f4f95','#8a3a1e',kd);
    const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,left);g.addColorStop(1,right);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // --- sun (source) ---
  ctx.fillStyle=mix('#fff4d6','#ffd9a0',kd);
  ctx.beginPath();ctx.arc(-70,450,170,0,Math.PI*2);ctx.fill();

  // --- molecules ---
  ctx.fillStyle='rgba(220,228,236,0.55)';
  for(const m of mols){ctx.beginPath();ctx.arc(m.x,m.y,4.5,0,Math.PI*2);ctx.fill();}

  // --- eye position ---
  const km=ease((t-11.0)/0.9);
  const ex=EYE_NOON.x+(EYE_DUSK.x-EYE_NOON.x)*km, ey=EYE_NOON.y+(EYE_DUSK.y-EYE_NOON.y)*km;

  // --- scatter rings ---
  for(const p of photons){
    if(!p.sc) continue;
    const ts=p.t0+(p.xs+40)/V; const k=(t-ts)/0.4;
    if(k<0||k>1) continue;
    ctx.strokeStyle=COL[p.c];ctx.globalAlpha=0.7*(1-k);ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(p.xs,p.y0,6+22*k,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // --- photons as short streaks (tail = motion blur) ---
  ctx.lineCap='round';ctx.lineWidth=5;
  const TAIL=0.055;
  for(const p of photons){
    const a=pathPos(p,t); if(!a) continue;
    if(a[0]<-60||a[0]>W+60||a[1]<-60||a[1]>H+60) continue;
    if(!p.sc && t>11.5 && a[0]>EYE_DUSK.x-22) continue;   // absorbed by eye at dusk
    let b=pathPos(p,Math.max(p.t0,t-TAIL)); if(!b) b=a;
    ctx.strokeStyle=COL[p.c];
    ctx.beginPath();ctx.moveTo(b[0],b[1]);
    if(p.sc){const ts=p.t0+(p.xs+40)/V; if(t-TAIL<ts&&t>ts) ctx.lineTo(p.xs,p.y0);}
    ctx.lineTo(a[0],a[1]);ctx.stroke();
  }

  // --- eye ---
  const iris=kd>0.01?mix('#7fb2ff','#ff9a52',kd):mix('#9aa3ad','#7fb2ff',kb);
  ctx.save();ctx.translate(ex,ey);
  const dir=km; // rotate eye to face left at dusk
  ctx.fillStyle='#f3f1ea';
  ctx.beginPath();ctx.moveTo(-58,0);ctx.quadraticCurveTo(0,-46,58,0);ctx.quadraticCurveTo(0,46,-58,0);ctx.fill();
  ctx.fillStyle=iris;ctx.beginPath();ctx.arc(-6*dir,-4*(1-dir),23,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0b0d12';ctx.beginPath();ctx.arc(-6*dir,-4*(1-dir),10,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#f3f1ea';ctx.font='500 36px '+FONT;ctx.textAlign='center';
  ctx.fillText('你的眼睛',ex,ey+(km>0.5?96:92));
  ctx.textAlign='left';

  // --- labels ---
  ctx.font='500 36px '+FONT;
  if(t<3.4){ // color legend
    const L=[['r','红光'],['g','绿光'],['b','蓝光']];
    L.forEach((it,i)=>{const x=1380+i*170,y=140;ctx.strokeStyle=COL[it[0]];ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(x,y-12);ctx.lineTo(x+40,y-12);ctx.stroke();
      ctx.fillStyle='#f3f1ea';ctx.fillText(it[1],x+52,y);});
  }
  if(t>=3.2&&t<7.4){ // name one molecule
    const m={x:760,y:300};
    ctx.fillStyle='#f3f1ea';ctx.beginPath();ctx.arc(m.x,m.y,7,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f3f1ea';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x+12,m.y-10);ctx.lineTo(m.x+60,m.y-48);ctx.stroke();
    ctx.fillText('空气分子',m.x+68,m.y-52);
  }
  if(t>=11.0){
    const k=ease((t-11.6)/0.6);
    ctx.globalAlpha=k;ctx.fillStyle='#f3f1ea';
    ctx.fillText('更厚的空气 →',820,360);
    ctx.globalAlpha=1;
  }

  // --- title ---
  ctx.fillStyle='#f3f1ea';ctx.font='700 64px '+FONT;
  ctx.fillText('天空为什么是蓝色的？',120,150);

  // --- captions ---
  for(const c of CAPS){
    if(t<c.t0||t>=c.t1) continue;
    const k=c.t0===0?1:dock((t-c.t0)/0.28);
    const off=(1-k)*26;
    ctx.globalAlpha=k;ctx.fillStyle='#ffffff';ctx.font='700 50px '+FONT;
    const base=c.note?880:920;
    c.txt.forEach((s,i)=>ctx.fillText(s,120,base+off+i*72));
    if(c.note){ctx.font='400 36px '+FONT;ctx.fillStyle='#d8e4f2';ctx.fillText(c.note,120,base+off+144+6);}
    ctx.globalAlpha=1;
  }
}

// ---- playback & seek ----
let paused=false,start=null;
function loop(now){
  if(paused) return;
  if(start===null) start=now;
  const t=((now-start)/1000)%DUR;
  draw(t);requestAnimationFrame(loop);
}
window.__seek=function(ms){paused=true;draw(clamp(ms/1000,0,DUR-0.0001));};
draw(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
