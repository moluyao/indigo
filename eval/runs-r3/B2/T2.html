<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>为什么天空是蓝色的</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0b1426}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function(){
const W=1920,H=1080,DUR=15000;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const layers=[0,1].map(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c;});
const FONT='"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ss=v=>{v=clamp(v);return v*v*(3-2*v);};
const eo=v=>{v=clamp(v);return 1-Math.pow(1-v,3);};
const lerp=(a,b,k)=>a+(b-a)*k;
function mix(c1,c2,k){return 'rgb('+[0,1,2].map(i=>Math.round(lerp(c1[i],c2[i],k))).join(',')+')';}

/* ---------- shared pieces ---------- */
function sky(g,k){ // k: 0 pale/grey -> 1 deep blue
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix([196,204,212],[26,92,196],k));
  gr.addColorStop(.62,mix([214,220,226],[110,175,236],k));
  gr.addColorStop(1,mix([226,230,234],[176,214,245],k));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function sun(g,x,y,r,a){
  g.save();g.globalAlpha=a;
  const gl=g.createRadialGradient(x,y,r*.4,x,y,r*4);
  gl.addColorStop(0,'rgba(255,250,225,.9)');gl.addColorStop(.3,'rgba(255,240,190,.35)');gl.addColorStop(1,'rgba(255,240,190,0)');
  g.fillStyle=gl;g.beginPath();g.arc(x,y,r*4,0,7);g.fill();
  g.fillStyle='#fffbe8';g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.restore();
}
function ground(g){
  const gr=g.createLinearGradient(0,800,0,H);
  gr.addColorStop(0,'#24503a');gr.addColorStop(1,'#10261b');
  g.fillStyle=gr;g.beginPath();g.moveTo(0,850);
  g.bezierCurveTo(500,800,1100,830,1920,790);g.lineTo(1920,H);g.lineTo(0,H);g.closePath();g.fill();
}
const PX=1500,PG=830; // person position / ground y under person
function person(g){
  g.save();g.fillStyle='#0d2219';
  // body
  g.beginPath();g.moveTo(PX-46,PG+12);g.quadraticCurveTo(PX-50,PG-130,PX,PG-140);
  g.quadraticCurveTo(PX+50,PG-130,PX+46,PG+12);g.closePath();g.fill();
  // neck + head tilted up
  g.translate(PX+4,PG-170);g.rotate(-.35);
  g.beginPath();g.ellipse(0,0,30,34,0,0,7);g.fill();
  g.restore();
}
const EYE=[PX+22,PG-186];
function molecule(g,x,y,r,a){
  g.save();g.globalAlpha=a;
  const gr=g.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#8d9bb0');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();
}
function wavePath(g,x0,x1,baseFn,ampFn,lam,phase){
  g.beginPath();
  for(let x=x0;x<=x1;x+=3){
    const y=baseFn(x)+ampFn(x)*Math.sin(2*Math.PI*(x-phase)/lam);
    if(x===x0)g.moveTo(x,y);else g.lineTo(x,y);
  }
}
function caption(g,step,lines,lt,dark){
  const a=eo((lt-.25)/.5),dy=(1-a)*24;
  g.save();g.globalAlpha=a;g.textBaseline='alphabetic';
  g.font='700 30px '+FONT;g.fillStyle='#ffcf5a';
  g.fillText(step,112,868+dy);
  g.font='700 58px '+FONT;g.fillStyle='#ffffff';
  g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=dark?0:18;
  lines.forEach((l,i)=>g.fillText(l,110,946+i*78+dy));
  g.restore();
}

/* ---------- scene 1 : question (0 - 3.4s) ---------- */
function s1(g,lt){
  sky(g,1);sun(g,250,190,62,1);ground(g);person(g);
  // question marks floating
  g.save();g.font='800 64px '+FONT;g.fillStyle='rgba(255,255,255,.9)';
  [[PX+70,PG-300,0],[PX-110,PG-360,.35],[PX+150,PG-430,.7]].forEach(([x,y,d])=>{
    const a=eo((lt-.6-d)/.5);g.globalAlpha=a;g.fillText('?',x,y-a*20+Math.sin(lt*2+d*5)*6);
  });g.restore();
  const a=eo((lt-.2)/.7);
  g.save();g.globalAlpha=a;g.fillStyle='#fff';g.shadowColor='rgba(10,40,90,.35)';g.shadowBlur=30;
  g.font='900 128px '+FONT;g.fillText('天空为什么',110,430+(1-a)*30);
  g.fillText('是蓝色的？',110,580+(1-a)*30);
  g.shadowBlur=12;g.globalAlpha=eo((lt-.9)/.6);
  g.font='600 40px '+FONT;g.fillStyle='#ffffff';
  g.fillText('三步讲清楚：阳光 · 空气 · 眼睛',116,666);
  g.restore();
}

/* ---------- scene 2 : white light = many colours (3.0 - 7.0s) ---------- */
const SPEC=[['红','#ff4d4d',150],['橙','#ff9a3c',130],['黄','#ffd84a',113],['绿','#4fd27a',97],['蓝','#3d8bff',81],['紫','#a070ff',67]];
function darkBg(g){
  const gr=g.createRadialGradient(W*.4,H*.4,100,W*.5,H*.5,1200);
  gr.addColorStop(0,'#16244a');gr.addColorStop(1,'#070d1c');g.fillStyle=gr;g.fillRect(0,0,W,H);
}
function s2(g,lt,t){
  darkBg(g);
  const SX=220,SY=430,SPLIT=760;
  sun(g,SX,SY,64,1);
  const bx=lerp(SX+70,SPLIT,eo((lt-.2)/.7));
  // white beam
  g.save();g.strokeStyle='#fff';g.lineWidth=12;g.lineCap='round';g.shadowColor='#fff';g.shadowBlur=24;
  g.beginPath();g.moveTo(SX+70,SY);g.lineTo(bx,SY);g.stroke();g.restore();
  g.save();g.font='700 32px '+FONT;g.fillStyle='rgba(255,255,255,.85)';g.globalAlpha=eo((lt-.5)/.4);
  g.fillText('阳光（看起来是白的）',SX+80,SY-40);g.restore();
  // split
  const front=lerp(SPLIT,1720,eo((lt-.9)/1.3));
  if(lt>.9){
    SPEC.forEach(([n,col,lam],i)=>{
      const yt=SY-225+i*90;
      const base=x=>lerp(SY,yt,ss((x-SPLIT)/220));
      const amp=x=>16*ss((x-SPLIT)/120);
      g.save();g.strokeStyle=col;g.lineWidth=5;g.shadowColor=col;g.shadowBlur=14;
      wavePath(g,SPLIT,front,base,amp,lam,t*420);g.stroke();g.restore();
      g.save();g.globalAlpha=eo((lt-2.0-i*.06)/.4);g.font='700 30px '+FONT;g.fillStyle=col;
      g.fillText(n,1750,yt+10);g.restore();
    });
    // wavelength labels
    g.save();g.globalAlpha=eo((lt-2.4)/.5);g.font='500 26px '+FONT;g.fillStyle='rgba(255,255,255,.75)';
    g.textAlign='right';g.fillText('波长长 ↑',1840,SY-280);g.fillText('波长短 ↓',1840,SY+290);g.restore();
  }
  caption(g,'01  阳光',['阳光看着是白的，','其实混着各种颜色的光。'],lt,true);
}

/* ---------- scene 3 : molecules scatter blue much more (6.6 - 11.4s) ---------- */
const MOLX=[640,940,1240,1540];
function s3(g,lt,t){
  darkBg(g);
  const rows=[{y:330,col:'#ff5a4d',lam:150,period:1.6,name:'红光',sub:'波长长：大多直接穿过去'},
              {y:600,col:'#3d8bff',lam:70,period:.26,name:'蓝光',sub:'波长短：一路被弹开'}];
  const X0=120,SPEED=1250,front=Math.min(1800,X0+Math.max(0,lt-.3)*SPEED);
  rows.forEach((r,ri)=>{
    // scattered rings
    MOLX.forEach((mx,mi)=>{
      const ta=.3+(mx-X0)/SPEED;
      if(lt<ta)return;
      const n=Math.floor((lt-ta)/r.period);
      for(let k=Math.max(0,n-8);k<=n;k++){
        const age=lt-ta-k*r.period;const rad=age*330;
        if(rad<4||rad>210)continue;
        const al=(ri?0.75:0.38)*(1-rad/210);
        g.save();g.strokeStyle=r.col;g.globalAlpha=al;g.lineWidth=ri?4:3;
        g.beginPath();g.arc(mx,r.y,rad,0,7);g.stroke();
        // short ray dashes showing "all directions"
        if(ri){for(let d=0;d<8;d++){const an=d*Math.PI/4+.39;g.beginPath();
          g.moveTo(mx+Math.cos(an)*(rad-14),r.y+Math.sin(an)*(rad-14));
          g.lineTo(mx+Math.cos(an)*(rad+6),r.y+Math.sin(an)*(rad+6));g.stroke();}}
        g.restore();
      }
    });
    // main wave (blue loses strength after each molecule)
    const amp=x=>{let a=24;if(ri)MOLX.forEach(mx=>{if(x>mx)a*=.8;});return a;};
    g.save();g.strokeStyle=r.col;g.lineWidth=6;g.shadowColor=r.col;g.shadowBlur=16;
    wavePath(g,X0,front,()=>r.y,amp,r.lam,t*420);g.stroke();g.restore();
    MOLX.forEach(mx=>molecule(g,mx,r.y,15,eo((lt-.1)/.4)));
    g.save();g.globalAlpha=eo((lt-.2)/.4);
    g.font='800 38px '+FONT;g.fillStyle=r.col;g.fillText(r.name,X0,r.y-70);
    g.font='500 26px '+FONT;g.fillStyle='rgba(255,255,255,.7)';g.fillText(r.sub,X0+94,r.y-72);
    g.restore();
  });
  // molecule label
  g.save();g.globalAlpha=eo((lt-.6)/.4);g.font='500 24px '+FONT;g.fillStyle='rgba(255,255,255,.8)';
  g.textAlign='center';g.fillText('空气分子',MOLX[0],330-46);g.restore();
  // bars
  const ba=eo((lt-2.3)/.5);
  if(ba>0){
    g.save();g.globalAlpha=ba;
    const bx=1180,by=850;
    g.font='700 28px '+FONT;g.fillStyle='#fff';g.fillText('被弹开的光有多少',bx,by);
    g.font='500 22px '+FONT;g.fillStyle='rgba(255,255,255,.55)';g.fillText('瑞利散射：波长越短，散射越强（∝ 1/波长⁴）',bx,by+36);
    const unit=72,grow=eo((lt-2.5)/.9);
    g.fillStyle='#ff5a4d';g.fillRect(bx+90,by+68,unit*Math.min(1,grow*5.5),34);
    g.fillStyle='#3d8bff';g.fillRect(bx+90,by+120,unit*5.5*grow,34);
    g.font='700 26px '+FONT;g.fillStyle='#fff';g.fillText('红光',bx,by+96);g.fillText('蓝光',bx,by+148);
    g.font='800 30px '+FONT;g.fillStyle='#ffcf5a';
    g.fillText('1',bx+100+unit,by+97);
    g.globalAlpha=ba*eo((lt-3.2)/.4);g.fillText('≈ 5.5 倍',bx+104+unit*5.5,by+149);
    g.restore();
  }
  caption(g,'02  空气',['空气分子会把光弹向四面八方，','波长短的蓝光被弹得最多。'],lt,true);
}

/* ---------- scene 4 : blue comes from everywhere (11.0 - 15s) ---------- */
const R4=rng(20261120);
const MOLS=[];for(let i=0;i<18;i++){MOLS.push({x:340+R4()*1380,y:150+R4()*470,ph:R4()*.6});}
MOLS.sort((a,b)=>Math.hypot(a.x-EYE[0],a.y-EYE[1])-Math.hypot(b.x-EYE[0],b.y-EYE[1]));
function s4(g,lt,t){
  const k=ss((lt-.4)/2.4);
  sky(g,k);
  sun(g,180,150,58,1);
  // incoming sunlight (faint white band)
  g.save();g.globalAlpha=.18;const bg=g.createLinearGradient(180,150,1900,600);
  bg.addColorStop(0,'#fff');bg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=bg;
  g.beginPath();g.moveTo(180,110);g.lineTo(1920,330);g.lineTo(1920,700);g.lineTo(180,190);g.closePath();g.fill();g.restore();
  ground(g);
  // scattering from each molecule
  MOLS.forEach((m,i)=>{
    const start=.2+m.ph;
    if(lt>start){
      const n=Math.floor((lt-start)/.5);
      for(let j=Math.max(0,n-3);j<=n;j++){
        const age=lt-start-j*.5,rad=age*200;if(rad<3||rad>110)continue;
        g.save();g.strokeStyle='#2f7bff';g.globalAlpha=.55*(1-rad/110);g.lineWidth=3;
        g.beginPath();g.arc(m.x,m.y,rad,0,7);g.stroke();g.restore();
      }
    }
    molecule(g,m.x,m.y,10,eo((lt-.1)/.4));
  });
  // rays into the eye
  MOLS.forEach((m,i)=>{
    const s=.9+i*.09,p=eo((lt-s)/.55);if(p<=0)return;
    const ex=lerp(m.x,EYE[0],p),ey=lerp(m.y,EYE[1],p);
    g.save();g.strokeStyle='rgba(225,240,255,.95)';g.lineWidth=3;g.setLineDash([12,10]);
    g.lineDashOffset=-t*60;
    g.beginPath();g.moveTo(m.x,m.y);g.lineTo(ex,ey);g.stroke();
    g.setLineDash([]);
    const an=Math.atan2(EYE[1]-m.y,EYE[0]-m.x);g.fillStyle='#e8f3ff';
    g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-Math.cos(an-.4)*18,ey-Math.sin(an-.4)*18);
    g.lineTo(ex-Math.cos(an+.4)*18,ey-Math.sin(an+.4)*18);g.closePath();g.fill();
    g.restore();
  });
  person(g);
  // eye glow
  const eg=eo((lt-1.6)/.6);
  if(eg>0){g.save();g.globalAlpha=eg*.9;const gl=g.createRadialGradient(EYE[0],EYE[1],2,EYE[0],EYE[1],60);
    gl.addColorStop(0,'rgba(140,200,255,.9)');gl.addColorStop(1,'rgba(140,200,255,0)');g.fillStyle=gl;
    g.beginPath();g.arc(EYE[0],EYE[1],60,0,7);g.fill();g.restore();}
  caption(g,'03  眼睛',['被弹开的蓝光从天空各处钻进眼睛，','所以抬头看，哪儿都是蓝的。'],lt,false);
  // final tag
  const fa=eo((lt-2.6)/.5);
  if(fa>0){
    g.save();g.globalAlpha=fa;const y=100+(1-fa)*16;
    g.fillStyle='rgba(8,24,60,.55)';
    g.beginPath();g.roundRect?g.roundRect(1330,y,480,150,24):g.rect(1330,y,480,150);g.fill();
    g.font='500 26px '+FONT;g.fillStyle='rgba(255,255,255,.8)';g.fillText('这个现象叫',1370,y+50);
    g.font='900 58px '+FONT;g.fillStyle='#fff';g.fillText('瑞利散射',1370,y+120);
    g.font='600 24px '+FONT;g.fillStyle='#ffcf5a';g.fillText('Rayleigh',1640,y+118);
    g.restore();
  }
}

/* ---------- timeline ---------- */
const SCENES=[[0,3.4,s1],[3.0,7.0,s2],[6.6,11.4,s3],[11.0,15.01,s4]];
const FADE=.4;
function progress(g,t){
  g.save();g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,H-6,W,6);
  g.fillStyle='#ffcf5a';g.fillRect(0,H-6,W*t/15,6);g.restore();
}
function draw(ms){
  const t=clamp(ms,0,DUR)/1000;
  ctx.clearRect(0,0,W,H);
  let li=0;
  for(const [a,b,fn] of SCENES){
    if(t<a||t>=b)continue;
    const L=layers[li++%2],g=L.getContext('2d');
    g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);
    fn(g,t-a,t);
    ctx.globalAlpha=a===0?1:ss((t-a)/FADE);
    ctx.drawImage(L,0,0);ctx.globalAlpha=1;
  }
  progress(ctx,t);
}
let seeking=false,t0=null;
window.__seek=function(ms){seeking=true;draw(ms);};
function loop(now){
  if(seeking)return;
  if(t0===null)t0=now;
  draw((now-t0)%DUR);
  requestAnimationFrame(loop);
}
draw(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
