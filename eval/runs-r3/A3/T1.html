<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>亲子大声朗读会</title>
<style>
html,body{margin:0;padding:0;background:#dfe5df}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#dfe5df;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;color:#1f2723}
.lib{position:absolute;left:80px;top:52px;font-size:30px;letter-spacing:2px;color:#3d4a42}
.plaque{position:absolute;left:80px;top:118px;width:920px;height:660px;border-radius:10px;
  background:linear-gradient(170deg,#fbfbf8 0%,#f1f2ee 100%);
  box-shadow:0 7px 0 #b9c0ba,0 22px 34px rgba(30,40,34,.22)}
.screw{position:absolute;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#e9ece9,#9aa29c);box-shadow:inset 0 0 0 1px #8a928c}
.screw::after{content:"";position:absolute;left:4px;top:11px;width:16px;height:2px;background:#6f7771;transform:rotate(35deg)}
.printed{position:absolute;left:60px;top:70px;font-size:160px;font-weight:700;letter-spacing:0;line-height:1;color:#151a17;white-space:nowrap}
.printed .q{display:inline-block}
.printed .rest{display:inline-block}
.hand{position:absolute;font-family:"STXingkai","华文行楷","STKaiti","KaiTi","楷体",serif;color:#d1271d;white-space:nowrap}
.h1{left:240px;top:290px;font-size:160px;line-height:1;transform:rotate(-4deg);transform-origin:left center}
.h2{left:270px;top:510px;font-size:66px;line-height:1;transform:rotate(-3deg);transform-origin:left center}
svg.mark{position:absolute;left:0;top:0;width:920px;height:660px;overflow:visible}
.title{position:absolute;left:80px;top:826px;font-size:84px;font-weight:700;line-height:1.15;letter-spacing:2px}
.info{position:absolute;left:80px;top:948px;font-size:48px;line-height:1.48;color:#1f2723}
.info .when{font-weight:700;font-size:54px}
.tag{position:absolute;right:80px;bottom:52px;font-size:26px;color:#4f5a53;letter-spacing:1px}
</style></head>
<body><div id="stage">
  <div class="lib">梧桐里社区图书馆</div>

  <div class="plaque">
    <div class="screw" style="left:22px;top:22px"></div>
    <div class="screw" style="right:22px;top:22px"></div>
    <div class="screw" style="left:22px;bottom:22px"></div>
    <div class="screw" style="right:22px;bottom:22px"></div>
    <div class="printed"><span class="q">请</span><span class="rest">保持安静</span></div>
    <svg class="mark" viewBox="0 0 920 660">
      <!-- 马克笔划掉"保持安静"：两道，起笔重、收笔带飞白 -->
      <path d="M212 160 C 360 142, 560 150, 870 128" fill="none" stroke="#d1271d" stroke-width="15" stroke-linecap="round"/>
      <path d="M226 186 C 420 170, 640 176, 858 158" fill="none" stroke="#d1271d" stroke-width="9" stroke-linecap="round" opacity=".92"/>
      <!-- 插入符：从被划处指向改写 -->
      <path d="M232 262 L 206 300 L 256 296" fill="none" stroke="#d1271d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="hand h1">大声朗读</div>
    <div class="hand h2">——仅限本周六下午</div>
  </div>

  <div class="title">亲子大声朗读会</div>
  <div class="info">
    <div class="when">11月28日 周六 15:00–16:30</div>
    <div>一楼少儿阅览区</div>
    <div>带一本想读给别人听的书</div>
    <div>免费 · 到馆服务台登记</div>
  </div>
  <div class="tag">示例信息 · 发布前替换</div>
</div></body></html>
