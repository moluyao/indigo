<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AURA ONE 降噪耳机</title>
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#0D0D10}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
const W=1080,H=1920,DUR=6000;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif';
const ACC='#FF6A3D';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,color,weight,align,alpha,ls){ctx.save();ctx.globalAlpha*=alpha==null?1:alpha;ctx.font=`${weight||700} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';if(ls)ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.restore();}

const R=rng(6006);
const NF=[];for(let i=0;i<7;i++)NF.push({f:0.01+R()*0.06,s:0.002+R()*0.01,p:R()*6.28,a:0.3+R()*0.7});
const SPK=[];for(let i=0;i<60;i++)SPK.push(R());
const DUST=[];for(let i=0;i<40;i++)DUST.push({x:R()*W,y:R()*H,r:1+R()*2.5,sp:0.01+R()*0.03,p:R()*6.28});

function bg(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16161B');g.addColorStop(1,'#08080A');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // warm glow behind product, grows when product lands
  const k=eo(seg(t,1200,2600));
  const rg=ctx.createRadialGradient(540,760,0,540,760,700);rg.addColorStop(0,`rgba(255,106,61,${.22*k})`);rg.addColorStop(1,'rgba(255,106,61,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  DUST.forEach(d=>{const y=(d.y-t*d.sp*3+H*10)%H;ctx.fillStyle=`rgba(255,255,255,${.06+.06*Math.sin(t/500+d.p)})`;ctx.beginPath();ctx.arc(d.x,y,d.r,0,7);ctx.fill();});
}

function noiseWave(t,amp,y,alpha){
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;
  for(let layer=0;layer<2;layer++){
    ctx.strokeStyle=layer?ACC:'rgba(255,255,255,.9)';ctx.lineWidth=layer?3:5;ctx.lineJoin='round';
    ctx.beginPath();
    for(let x=70;x<=W-70;x+=6){
      let v=0;NF.forEach((n,i)=>{v+=n.a*Math.sin(x*n.f+t*n.s*(layer?1.3:1)+n.p+i);});
      const sp=SPK[Math.floor(x/18+t/40)%SPK.length];v+=(sp>.82?(sp-.82)*14:0)*(Math.floor(x/6)%2?1:-1);
      const edge=Math.sin(Math.PI*(x-70)/(W-140));
      const yy=y+v*amp*42*edge*(layer?.7:1);
      x===70?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function cupPath(x,y,w,h){rrect(x-w/2,y-h/2,w,h,w*0.46);}
function headphones(cx,cy,s,turn,t,sweep){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const sx=Math.cos(turn); // fake y-rotation
  ctx.scale(Math.max(.25,Math.abs(sx)),1);
  // headband
  ctx.lineCap='round';
  ctx.strokeStyle='#26262D';ctx.lineWidth=54;ctx.beginPath();ctx.arc(0,30,262,Math.PI*1.04,Math.PI*1.96);ctx.stroke();
  const hb=ctx.createLinearGradient(0,-240,0,-150);hb.addColorStop(0,'#4A4A55');hb.addColorStop(1,'#1B1B21');
  ctx.strokeStyle=hb;ctx.lineWidth=38;ctx.beginPath();ctx.arc(0,30,262,Math.PI*1.04,Math.PI*1.96);ctx.stroke();
  ctx.strokeStyle=ACC;ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,30,286,Math.PI*1.38,Math.PI*1.62);ctx.stroke();
  // yokes
  ctx.strokeStyle='#9A9AA6';ctx.lineWidth=10;
  [-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(d*252,-40);ctx.lineTo(d*262,60);ctx.stroke();});
  // cups
  [-1,1].forEach(d=>{
    const x=d*262,y=150,w=170,h=270;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=40;ctx.shadowOffsetY=20;
    const cg=ctx.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);cg.addColorStop(0,'#3A3A44');cg.addColorStop(.5,'#1C1C22');cg.addColorStop(1,'#0B0B0E');
    ctx.fillStyle=cg;cupPath(x,y,w,h);ctx.fill();ctx.restore();
    // cushion edge (inner side)
    ctx.fillStyle='#131317';rrect(x-d*w/2-d*6-(d>0?0:0)-14,y-h/2+22,28,h-44,14);ctx.fill();
    // rim highlight
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;cupPath(x,y,w-10,h-10);ctx.stroke();
    // accent ring + logo
    ctx.strokeStyle=ACC;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,44,0,7);ctx.stroke();
    ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();
    // light sweep
    if(sweep>0&&sweep<1){
      ctx.save();cupPath(x,y,w,h);ctx.clip();
      const px=lerp(-500,500,sweep);
      const sg=ctx.createLinearGradient(px-120,0,px+120,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.35)');sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sg;ctx.fillRect(x-w,y-h,w*2,h*2);ctx.restore();
    }
  });
  ctx.restore();
}

function rings(t,cx,cy,s,alpha){
  if(alpha<=0)return;
  [-1,1].forEach(d=>{
    const x=cx+d*262*s,y=cy+150*s;
    for(let i=0;i<4;i++){
      const ph=((t/1100)+i/4)%1;const r=lerp(100,520,ph)*s;
      ctx.strokeStyle=`rgba(255,106,61,${alpha*(1-ph)*.55})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,r,d<0?Math.PI*0.5:-Math.PI*0.5,d<0?Math.PI*1.5:Math.PI*0.5);ctx.stroke();
    }
  });
}

const FEATS=[
  {n:'-45',u:'dB',l:'自适应主动降噪',d:'地铁、工位、航班，一键静音'},
  {n:'40',u:'小时',l:'超长续航',d:'充电 10 分钟，再听 5 小时'},
  {n:'3D',u:'',l:'空间音频',d:'声音跟着你转头，像在现场'}
];

function draw(t){
  ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.letterSpacing='0px';
  bg(t);

  // ---- product position over time ----
  const land=back(seg(t,1150,2000));            // drop in
  const toEnd=eio(seg(t,4500,5200));            // move up for end card
  let cy=lerp(-500,780,land);cy=lerp(cy,700,toEnd);
  const sc=lerp(1,1.08,toEnd)*lerp(0.85,1,land);
  const turn=lerp(0.9,0,eo(seg(t,1150,2300)))+Math.sin(t/900)*0.05*seg(t,2300,2800);

  // ---- noise wave (scene 1 -> flatten) ----
  const calm=1-eio(seg(t,1500,2400));
  const waveY=lerp(900,1080,eio(seg(t,1500,2400)));
  noiseWave(t,lerp(.03,1,calm)*(1+0.2*Math.sin(t/120)),waveY,1-seg(t,2600,3000));

  rings(t,540,cy,sc,seg(t,2400,2900)*(1-seg(t,5600,6000)*0));
  if(t>=1100)headphones(540,cy,sc*0.95,turn,t,seg(t,2100,2900));

  // ---- scene 1 text ----
  {const a=(1-seg(t,1250,1550));
   if(a>0){const jx=(SPK[Math.floor(t/50)%60]-.5)*14*(1-seg(t,900,1250)),jy=(SPK[(Math.floor(t/50)+7)%60]-.5)*10*(1-seg(t,900,1250));
     ctx.save();ctx.globalAlpha=a;
     text('世界太吵了？',540+jx+4,1420+jy,132,'rgba(255,106,61,.6)',900);
     text('世界太吵了？',540+jx,1420+jy,132,'#FFFFFF',900);
     text('地铁 · 键盘声 · 隔壁装修 · 邻座电话',540,1530,38,'rgba(255,255,255,.55)',500);
     ctx.restore();}
   // tiny label top
   text('NOISE  98 dB',540,260,30,'rgba(255,255,255,.5)',700,'center',a,8);
  }

  // ---- scene 2 text ----
  {const k=eo(seg(t,1900,2400));const a=k*(1-seg(t,2650,2880));
   if(a>0){ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-k)*30);
     text('戴上，',540,1300,120,'#FFFFFF',900);
     text('世界就静了。',540,1440,120,ACC,900);
     ctx.restore();}
   text('NOISE  12 dB',540,260,30,'rgba(255,255,255,.5)',700,'center',a,8);
  }

  // ---- scene 3 features ----
  {const out=1-seg(t,4450,4750);
   FEATS.forEach((f,i)=>{
     const st=2950+i*380;const k=eo(seg(t,st,st+450));const a=k*out;if(a<=0)return;
     const y=1210+i*190;
     ctx.save();ctx.globalAlpha=a;ctx.translate((1-k)*80,0);
     ctx.fillStyle='rgba(255,255,255,.05)';rrect(80,y-10,920,160,28);ctx.fill();
     ctx.fillStyle=ACC;rrect(80,y-10,8,160,4);ctx.fill();
     ctx.font=`900 96px ${FONT}`;const nw=ctx.measureText(f.n).width;
     text(f.n,130,y+108,96,'#FFFFFF',900,'left');
     if(f.u)text(f.u,130+nw+8,y+108,36,ACC,800,'left');
     text(f.l,470,y+66,46,'#FFFFFF',800,'left');
     text(f.d,470,y+116,30,'rgba(255,255,255,.55)',500,'left');
     ctx.restore();
   });
  }

  // ---- end card ----
  {const k=eo(seg(t,4800,5400));
   if(k>0){
     ctx.save();ctx.globalAlpha=k;ctx.translate(0,(1-k)*40);
     text('AURA ONE',540,1290,150,'#FFFFFF',900,'center',1,10);
     text('降噪头戴式耳机',540,1370,40,'rgba(255,255,255,.6)',500,'center',1,12);
     ctx.restore();
     const k2=eo(seg(t,5100,5600));
     ctx.save();ctx.globalAlpha=k2;ctx.translate(0,(1-k2)*30);
     text('静下来，才听得见。',540,1530,64,ACC,800);
     ctx.fillStyle=ACC;rrect(340,1620,400,104,52);ctx.fill();
     text('现已开售',540,1690,44,'#120A06',900,'center',1,6);
     ctx.restore();
   }
  }
  // brand mark top (always after landing)
  text('AURA',540,150,30,'rgba(255,255,255,.75)',900,'center',seg(t,2000,2500)*(1-seg(t,4700,5000)*0),14);
}

let seeking=false,start=performance.now();
window.__seek=function(ms){seeking=true;draw(clamp(+ms||0,0,DUR));};
function loop(now){if(!seeking)draw((now-start)%DUR);requestAnimationFrame(loop);}
draw(0);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
