<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>T1 旧书交换日</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#2b1f17}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;position:relative}
#shelf{position:absolute;left:0;top:0;width:1080px;height:830px;background:#1c140e;overflow:hidden}
.board{position:absolute;left:0;width:1080px;background:#5a4130}
.board.top{top:0;height:34px;box-shadow:0 10px 18px rgba(0,0,0,.55)}
.board.bot{top:790px;height:40px;background:#6b4d38}
.book{position:absolute;bottom:40px;border-radius:3px 3px 0 0}
.book .lab{position:absolute;left:50%;transform:translateX(-50%);bottom:46px;background:#efeee8;color:#3a3a36;font-size:9px;line-height:11px;padding:3px 2px;width:76%;text-align:center;border-radius:2px}
.book .band{position:absolute;left:0;right:0;height:6px;background:rgba(0,0,0,.18)}
#gap{position:absolute;bottom:40px;left:398px;width:150px;height:610px;background:#0d0906}
#pulled{position:absolute;left:392px;bottom:150px;width:166px;height:640px;background:#b3261e;
  transform:rotate(5deg);transform-origin:50% 100%;border-radius:4px 4px 2px 2px;
  box-shadow:-22px 18px 34px rgba(0,0,0,.6), inset -10px 0 0 rgba(0,0,0,.13), inset 8px 0 0 rgba(255,255,255,.07)}
#pulled .title{position:absolute;top:66px;left:0;width:166px;writing-mode:vertical-rl;text-orientation:upright;
  font-size:80px;line-height:166px;font-weight:700;color:#f6e7c6;letter-spacing:4px;text-align:start}
#pulled .rule{position:absolute;left:18px;right:18px;height:4px;background:#f6e7c6;opacity:.85}
#pulled .lab2{position:absolute;left:22px;right:22px;bottom:28px;background:#f4f2ea;color:#1d1d1b;text-align:center;border-radius:3px;padding:8px 0 10px}
#pulled .lab2 b{display:block;font-size:40px;line-height:44px;font-weight:700}
#pulled .lab2 span{display:block;font-size:30px;line-height:34px}
#info{position:absolute;left:0;top:830px;width:1080px;height:520px;background:#dfe4dc;color:#1b1f1a;padding:58px 84px 0 84px}
#info h1{font-size:70px;line-height:86px;font-weight:800;letter-spacing:1px}
#info .when{margin-top:30px;font-size:56px;line-height:66px;font-weight:700}
#info .where{margin-top:22px;font-size:42px;line-height:56px;font-weight:400}
#info .free{margin-top:14px;font-size:42px;line-height:56px;font-weight:400}
#info .note{position:absolute;right:84px;bottom:34px;font-size:26px;line-height:30px;color:#4d5249}
</style></head><body>
<div id="shelf">
  <div class="board top"></div>
  <div id="books"></div>
  <div id="gap"></div>
  <div class="board bot"></div>
  <div id="pulled">
    <div class="rule" style="top:40px"></div>
    <div class="title">旧书交换日</div>
    <div class="rule" style="bottom:146px"></div>
    <div class="lab2"><b>11.21</b><span>周六</span></div>
  </div>
</div>
<div id="info">
  <h1>带一本旧书，换一本回家</h1>
  <div class="when">11月21日 周六 14:00–16:30</div>
  <div class="where">梧桐社区图书馆　社区服务中心 2 楼</div>
  <div class="free">免费，不用报名</div>
  <div class="note">样稿：馆名、时间、地点为示例</div>
</div>
<script>
// deterministic shelf of faded cloth spines with call-number labels (texture only, 9px)
const cols=['#3d4f63','#6b7a4e','#8a6d3b','#4a3b52','#5d6b6e','#7b5a44','#33463b','#6e5c6e','#45525e','#8b7a55','#55463a','#3f5a58'];
const nums=['I287.5','K825','G613','I247.5','TS972','Q95','I712','N49','J292','H319','K92','I313'];
let s=7;function r(){s=(s*1103515245+12345)%2147483648;return s/2147483648}
const host=document.getElementById('books');let x=-18,i=0;
while(x<1100){
  if(x>330&&x<560){x=560;continue}
  const w=Math.round(62+r()*40),h=Math.round(520+r()*170);
  const b=document.createElement('div');b.className='book';
  b.style.cssText=`left:${x}px;width:${w}px;height:${h}px;background:${cols[i%cols.length]}`;
  b.innerHTML=`<div class="band" style="top:${30+Math.round(r()*20)}px"></div><div class="band" style="top:${70+Math.round(r()*20)}px"></div><div class="lab">${nums[i%nums.length]}</div>`;
  host.appendChild(b);x+=w+2;i++;
}
// left neighbour of the gap
</script>
</body></html>
