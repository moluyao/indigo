<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>T3 听岛 H1</title>
<style>html,body{margin:0;padding:0;background:#e2532d;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,CX=540,CY=900;
const BG='#e2532d',SHELL='#f3efe6',PAD='#2a2622',INK='#141210';
const FONT='"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=u=>{u=cl(u,0,1);return u*u*(3-2*u);};
const eout=u=>{u=cl(u,0,1);return 1-Math.pow(1-u,3);};
const eio=u=>{u=cl(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function state(t){
  // c = cup centre offset, cush = cushion thickness, z = zoom
  let c,cush,z;
  const uo=eout((t-0.5)/1.0);            // open 0.5-1.5
  c=lerp(104,330,uo);z=lerp(1.3,1.0,uo);cush=40;
  const uc=eio((t-3.8)/0.6);             // clamp 3.8-4.4
  if(t>3.8){c=lerp(330,294,uc);cush=lerp(40,34,uc);}
  return {c,cush,z};
}
function cup(side,c,cush){ // side -1 left, +1 right
  const cx=CX+side*c, top=CY-150;
  // shell occupies outer 160px, cushion the inner part
  const shellX = side<0 ? cx-100 : cx+100-160;
  g.fillStyle=SHELL;rr(shellX,top,160,300,70);g.fill();
  // cushion
  const innerFace = side<0 ? cx+60+cush : cx-60-cush; // face toward centre
  const px = side<0 ? cx+60-6 : innerFace;
  g.fillStyle=PAD;rr(px,top+18,cush+6,264,cush/2);g.fill();
  // L / R
  g.fillStyle=PAD;g.font=`800 110px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
  g.fillText(side<0?'L':'R',shellX+80,CY+4);
}
function headphone(s){
  g.save();g.translate(CX,CY);g.scale(s.z,s.z);g.translate(-CX,-CY);
  const ax=s.c+20, ay=CY-150-34;
  // yokes
  g.strokeStyle=SHELL;g.lineWidth=22;g.lineCap='round';
  g.beginPath();g.moveTo(CX-ax,ay);g.lineTo(CX-ax,CY-150);g.moveTo(CX+ax,ay);g.lineTo(CX+ax,CY-150);g.stroke();
  // band: quadratic, apex fixed height above cups
  const apex=470, ctrlY=2*apex-ay;
  g.lineWidth=44;g.beginPath();g.moveTo(CX-ax,ay);g.quadraticCurveTo(CX,ctrlY,CX+ax,ay);g.stroke();
  cup(-1,s.c,s.cush);cup(1,s.c,s.cush);
  g.restore();
}
function render(t){
  t=cl(t,0,6);
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  const s=state(t);headphone(s);
  g.textAlign='center';g.textBaseline='middle';g.fillStyle=INK;
  const a1=sm((t-1.6)/0.15);
  if(a1>0){g.globalAlpha=a1;g.font=`800 120px ${FONT}`;g.fillText('中间，',CX,CY-66);g.fillText('留给你',CX,CY+74);g.globalAlpha=1;}
  const a2=sm((t-2.6)/0.15);
  if(a2>0){g.globalAlpha=a2;g.font=`800 120px ${FONT}`;g.fillText('听岛 H1',CX,1290);
    g.font=`400 40px ${FONT}`;g.fillStyle='#3b140a';g.fillText('示例名',CX,1390);g.globalAlpha=1;}
}
let paused=false,t0=null;
window.__seek=function(ms){paused=true;render(ms/1000);};
function loop(now){if(paused)return;if(t0===null)t0=now;render(((now-t0)/1000)%6);requestAnimationFrame(loop);}
render(0);requestAnimationFrame(loop);
</script></body></html>
