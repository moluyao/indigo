<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>日落回声音乐节 SUNSET ECHO 2027</title>
<style>
  html,body{margin:0;padding:0;background:#F1E6D0}
  svg{display:block;width:1080px;height:1350px}
</style>
</head>
<body>
<svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <radialGradient id="sun" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#F26A3C"/>
      <stop offset="1" stop-color="#D93B25"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B4E"/>
      <stop offset="1" stop-color="#151A33"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .09  0 0 0 0 .06  0 0 0 .9 -.3"/>
    </filter>
    <path id="ring" d="M 880 450 m -62 0 a 62 62 0 1 1 124 0 a 62 62 0 1 1 -124 0"/>
  </defs>

  <!-- paper -->
  <rect width="1080" height="1350" fill="#F1E6D0"/>

  <!-- top meta -->
  <g font-family="Consolas,'SF Mono',Menlo,monospace" font-size="22" fill="#1B2140" letter-spacing="2">
    <text x="70" y="78">VOL.07 · 第七届</text>
    <text x="1010" y="78" text-anchor="end">2027.07.16 — 07.18</text>
  </g>
  <rect x="70" y="96" width="940" height="2" fill="#1B2140"/>

  <!-- title -->
  <text x="70" y="268" textLength="940" lengthAdjust="spacingAndGlyphs"
        font-family="Impact,'Arial Black','Helvetica Neue',sans-serif" font-size="168" font-weight="900"
        fill="#1B2140">SUNSET ECHO</text>
  <text x="72" y="340" textLength="936" lengthAdjust="spacing"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
        font-size="52" font-weight="900" fill="#1B2140">日落回声音乐节</text>

  <!-- side vertical text -->
  <text x="104" y="430" writing-mode="vertical-rl" letter-spacing="10"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#1B2140">湖畔 · 三日 · 露营 · 落日场</text>

  <!-- sun -->
  <circle cx="540" cy="640" r="250" fill="url(#sun)"/>
  <!-- sun slices -->
  <g fill="#F1E6D0">
    <rect x="280" y="664" width="520" height="4"/>
    <rect x="280" y="700" width="520" height="7"/>
    <rect x="280" y="734" width="520" height="10"/>
    <rect x="280" y="764" width="520" height="13"/>
    <rect x="280" y="791" width="520" height="16"/>
  </g>

  <!-- stamp -->
  <g>
    <circle cx="880" cy="450" r="86" fill="#F2B33D"/>
    <circle cx="880" cy="450" r="86" fill="none" stroke="#1B2140" stroke-width="2"/>
    <text font-family="Consolas,'SF Mono',monospace" font-size="17" font-weight="700" fill="#1B2140" letter-spacing="3.2">
      <textPath href="#ring">LAKESIDE · ALL DAY · ALL NIGHT · </textPath>
    </text>
    <text x="880" y="468" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="52" fill="#1B2140">3天</text>
  </g>

  <!-- hills -->
  <polygon fill="#1B2140" points="0,822 0,768 80,748 160,772 250,722 330,770 400,790 450,822"/>
  <polygon fill="#1B2140" points="1080,822 1080,752 1000,736 920,770 840,748 760,790 690,822"/>

  <!-- lake -->
  <rect x="0" y="820" width="1080" height="190" fill="url(#water)"/>
  <g id="refl"></g>

  <!-- lineup -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" fill="#1B2140">
    <g font-family="Consolas,'SF Mono',monospace" font-size="22" font-weight="700" fill="#D93B25" letter-spacing="2">
      <text x="70" y="1052">FRI 07.16</text>
      <text x="410" y="1052">SAT 07.17</text>
      <text x="750" y="1052">SUN 07.18</text>
    </g>
    <rect x="70" y="1066" width="940" height="2" fill="#1B2140"/>
    <rect x="390" y="1080" width="1.5" height="168" fill="#1B2140" opacity=".35"/>
    <rect x="730" y="1080" width="1.5" height="168" fill="#1B2140" opacity=".35"/>

    <g font-size="42" font-weight="900">
      <text x="70" y="1122">白昼航线</text>
      <text x="410" y="1122">盐湖电台</text>
      <text x="750" y="1122">山谷回响</text>
    </g>
    <g font-size="25" font-weight="500">
      <text x="70" y="1166">NOVA KITE</text>
      <text x="70" y="1202">潮汐研究所</text>
      <text x="70" y="1238">雾港乐队</text>
      <text x="410" y="1166">LUNA PARADE</text>
      <text x="410" y="1202">晚风合作社</text>
      <text x="410" y="1238">玻璃鲸鱼</text>
      <text x="750" y="1166">ECHO ROOM</text>
      <text x="750" y="1202">热带旅馆</text>
      <text x="750" y="1238">六点半乐团</text>
    </g>
  </g>

  <!-- bottom bar -->
  <rect x="0" y="1272" width="1080" height="78" fill="#1B2140"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#F1E6D0">
    <text x="70" y="1320">千岛湖 · 湖畔大草坪</text>
    <text x="1010" y="1320" text-anchor="end"><tspan fill="#F2B33D">早鸟票 ¥380</tspan>  ·  11.18 开售</text>
  </g>

  <!-- grain -->
  <rect width="1080" height="1350" filter="url(#grain)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', g=document.getElementById('refl');
  function r(x,y,w,h,f,o){var e=document.createElementNS(NS,'rect');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('width',w);e.setAttribute('height',h);e.setAttribute('fill',f);if(o!=null)e.setAttribute('opacity',o);g.appendChild(e);}
  for(var i=0;i<13;i++){
    var y=830+i*13.5, k=1-i/14.5;
    var w=470*k*(0.86+0.14*Math.sin(i*2.3));
    var off=Math.sin(i*1.7)*16*(i/13+0.3);
    var h=Math.max(2,7-i*0.38);
    var x=540-w/2+off;
    r(x,y,w,h,'#E8502E',(0.95-i*0.055).toFixed(3));
    // ripple gaps
    var gaps=1+(i%3);
    for(var j=0;j<gaps;j++){
      var gx=x+w*(0.18+0.64*((Math.sin(i*3.1+j*5.7)+1)/2));
      r(gx,y-1,10+((i+j)%3)*6,h+2,'#1E2546');
    }
  }
})();
</script>
</body>
</html>
