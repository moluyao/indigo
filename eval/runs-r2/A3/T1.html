<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>音乐节</title>
<style>
html,body{margin:0;height:100%;background:#1a1a1a}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(100vw,calc(100vh*1080/1350));height:auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script>
(function(){
  // 双色孔版：纸 + 蓝墨 + 荧光粉墨，两版正片叠底，粉版有 3px 套印错位
  var W=1080,H=1350;
  var PAPER='#eef0ea', BLUE='#1d2c9c', PINK='#ff3d7f';
  var FONT='"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","SimHei",sans-serif';

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var rnd=mulberry32(1350);

  var c=document.getElementById('c'), ctx=c.getContext('2d');
  function plate(){var k=document.createElement('canvas');k.width=W;k.height=H;return k;}
  var pinkC=plate(), p=pinkC.getContext('2d');
  var blueC=plate(), b=blueC.getContext('2d');

  // ---------- 粉版：舞台灯光照到人群上的那块地 ----------
  p.fillStyle=PINK;
  p.beginPath();
  p.moveTo(236,88); p.lineTo(844,88);
  p.lineTo(1044,672);
  p.quadraticCurveTo(540,840,36,672);
  p.closePath(); p.fill();

  // ---------- 蓝版 ----------
  b.fillStyle=BLUE;
  // 舞台（顶边出血）
  b.fillRect(180,0,720,86);
  // 舞台字：镂空（不上墨 = 纸色）
  b.save();
  b.globalCompositeOperation='destination-out';
  b.font='700 30px '+FONT; b.textAlign='center'; b.textBaseline='middle';
  b.fillText('舞　台',540,46);
  b.restore();
  // 前排护栏
  b.fillRect(110,122,860,5);

  // 人群：俯视，一人 = 两肩 + 头；全部朝向舞台
  var STAGE={x:540,y:40};
  var PIT={x:604,y:500,r:112};          // 唯一的例外：一个转圈的空场
  function spacing(y){return 25+34*Math.pow(Math.max(0,(y-146)/700),1.3);}
  function keep(y){return y<600?1:Math.pow(Math.max(0,1-(y-600)/220),1.6);}
  var people=[];
  var y=146,row=0;
  while(y<830){
    var d=spacing(y), off=(row%2)*d*0.5;
    for(var x=20+off-d;x<1080;x+=d*1.05){
      var px=x+(rnd()-0.5)*d*0.6, py=y+(rnd()-0.5)*d*0.5;
      var k=rnd(), arm=rnd();
      if(px<14||px>1066||py<142) continue;
      if(py<190&&(px<118||px>962)) continue;
      if(k>keep(py)) continue;
      if(Math.hypot(px-PIT.x,py-PIT.y)<PIT.r+14) continue;
      var inLight=py<660&&Math.abs(px-540)<300+py*0.35;
      people.push({x:px,y:py,a:Math.atan2(STAGE.y-py,STAGE.x-px),arms:arm<(inLight?0.16:0.06)});
    }
    y+=d*0.92; row++;
  }
  // 圈里的人：沿切线方向跑（屏幕上顺时针）
  var n=26;
  for(var i=0;i<n;i++){
    var th=i/n*Math.PI*2+(rnd()-0.5)*0.12, rr=PIT.r-2+(rnd()-0.5)*10;
    people.push({x:PIT.x+Math.cos(th)*rr,y:PIT.y+Math.sin(th)*rr,a:th+Math.PI/2,arms:false});
  }

  var S=22;
  function person(P){
    b.save(); b.translate(P.x,P.y); b.rotate(P.a);
    b.fillStyle=BLUE;
    b.beginPath(); b.ellipse(-1,0,S*0.26,S*0.54,0,0,Math.PI*2); b.fill();
    if(P.arms){
      b.strokeStyle=BLUE; b.lineWidth=3.6; b.lineCap='round';
      b.beginPath();
      b.moveTo(1,-S*0.42); b.lineTo(S*0.86,-S*0.64);
      b.moveTo(1, S*0.42); b.lineTo(S*0.86, S*0.64);
      b.stroke();
    }
    // 头与肩之间留一圈不上墨的纸
    b.globalCompositeOperation='destination-out';
    b.beginPath(); b.arc(S*0.06,0,S*0.25+2.2,0,Math.PI*2); b.fill();
    b.globalCompositeOperation='source-over';
    b.beginPath(); b.arc(S*0.06,0,S*0.25,0,Math.PI*2); b.fill();
    b.restore();
  }
  for(var j=0;j<people.length;j++) person(people[j]);

  // 圈内的跑动痕：三段顺时针弧
  b.strokeStyle=BLUE; b.lineWidth=3; b.lineCap='round';
  [0.4,2.5,4.6].forEach(function(a0){
    b.beginPath(); b.arc(PIT.x,PIT.y,PIT.r-36,a0,a0+0.62); b.stroke();
  });

  // ---------- 合版 ----------
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='multiply';
  ctx.drawImage(pinkC,3,-2);
  ctx.drawImage(blueC,0,0);

  // 大字：纵向拉长的黑体，撑满版心宽 940
  ctx.fillStyle=BLUE;
  ctx.font='900 300px '+FONT;
  ctx.textAlign='left'; ctx.textBaseline='ideographic';
  var mw=ctx.measureText('音乐节').width||900;
  var sx=940/mw;
  ctx.save(); ctx.translate(70,1206); ctx.scale(sx,sx*1.16);
  ctx.fillText('音乐节',0,0);
  ctx.restore();

  // 加印区：日期 / 地点 / 阵容 留给主办方套印
  ctx.font='700 28px '+FONT; ctx.textBaseline='alphabetic';
  var fields=[['日期',70,330],['地点',386,676],['阵容',732,1010]];
  fields.forEach(function(f){
    ctx.fillText(f[0],f[1],1288);
    ctx.fillRect(f[1]+70,1290,f[2]-(f[1]+70),3);
  });
  ctx.globalCompositeOperation='source-over';
})();
</script>
</body>
</html>
