<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>山野咖啡 · Logo 开场</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{position:absolute;left:0;top:0;transform-origin:0 0;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function(){
const W = 1920, H = 1080, DUR = 8;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SERIF = "'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','STZhongsong','SimSun',serif";
const LAT = "'Didot','Bodoni 72','Georgia','Times New Roman',serif";
const COL = { bg:'#161A15', cream:'#EDE3D0', shade:'#D2C3A6', tan:'#B39B78', terra:'#C9743E', gold:'#C9A46C', mute:'#8D9183' };

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;

// 固定种子随机
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(1907);

// 远山层（固定相位）
const layers = [0, 1, 2].map(i => ({
  base: [800, 880, 960][i], amp: [70, 60, 50][i], col: ['#232A20', '#1D231B', '#141813'][i],
  speed: [6, 12, 20][i], ph: [rnd() * 6, rnd() * 6, rnd() * 6, rnd() * 6]
}));
// 浮尘
const dust = Array.from({ length: 70 }, () => ({ x: rnd() * W, y: rnd() * H, v: 8 + rnd() * 22, r: .8 + rnd() * 2.2, ph: rnd() * 6.28, a: .12 + rnd() * .3 }));
// 颗粒噪点（一次生成）
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), im = g.createImageData(256, 256); for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }
const grainPat = ctx.createPattern(grain, 'repeat');

// ---- 标志几何（以标志中心为原点）----
const MX = 960, MY = 400, RX = 128, RY = 168, ROT = -18 * Math.PI / 180;
const ridge = [[-430, 72], [-150, 72], [-58, -36], [-18, 6], [42, -84], [150, 72], [430, 72]];
const front = [[-170, 124], [-72, 64], [-20, 94], [44, 56], [170, 116]];
const crease = t => { // 豆子中缝：从豆尖弯下来，流进主峰
  const p0 = [RY * Math.sin(ROT), -RY * Math.cos(ROT)], p1 = [8, -150], p2 = [4, -104], p3 = [42, -84];
  const m = 1 - t; return [m*m*m*p0[0] + 3*m*m*t*p1[0] + 3*m*t*t*p2[0] + t*t*t*p3[0], m*m*m*p0[1] + 3*m*m*t*p1[1] + 3*m*t*t*p2[1] + t*t*t*p3[1]];
};
const creasePts = Array.from({ length: 41 }, (_, i) => crease(i / 40));

function partial(pts, p) {
  let L = 0; const ls = [0];
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); ls.push(L); }
  const tgt = L * p, out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (ls[i] <= tgt) out.push(pts[i]);
    else { const f = (tgt - ls[i - 1]) / (ls[i] - ls[i - 1]); out.push([lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]); break; }
  }
  return out;
}
function strokePts(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
function beanPath() { ctx.beginPath(); ctx.ellipse(0, 0, RX, RY, ROT, 0, Math.PI * 2); }

function drawBackground(t) {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  // 中心微光
  const glow = ctx.createRadialGradient(MX, MY + 40, 0, MX, MY + 40, 900);
  const ga = .10 + .10 * eo(seg(t, 3.6, 5.2));
  glow.addColorStop(0, `rgba(201,116,62,${ga})`); glow.addColorStop(.5, 'rgba(201,116,62,0.02)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // 远山 + 雾
  const la = eo(seg(t, 0, 1.4));
  layers.forEach((L, i) => {
    ctx.save(); ctx.globalAlpha = la; ctx.fillStyle = L.col;
    ctx.beginPath(); ctx.moveTo(0, H);
    const off = t * L.speed;
    for (let x = 0; x <= W; x += 16) {
      const X = x + off;
      const y = L.base - L.amp * (0.5 * Math.sin(X * .0021 + L.ph[0]) + 0.3 * Math.sin(X * .0053 + L.ph[1]) + 0.2 * Math.sin(X * .0131 + L.ph[2]));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // 雾带
    const fg = ctx.createLinearGradient(0, L.base - 60, 0, L.base + 80);
    fg.addColorStop(0, 'rgba(237,227,208,0)'); fg.addColorStop(.5, `rgba(237,227,208,${0.035 - i * 0.008})`); fg.addColorStop(1, 'rgba(237,227,208,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, L.base - 60, W, 140);
    ctx.restore();
  });
  // 浮尘
  const da = seg(t, .3, 1.5);
  ctx.fillStyle = COL.cream;
  dust.forEach(d => {
    const y = ((d.y - d.v * t) % H + H) % H, x = d.x + Math.sin(t * .6 + d.ph) * 18;
    ctx.globalAlpha = d.a * da * (0.6 + 0.4 * Math.sin(t * 1.3 + d.ph));
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawMark(t) {
  const sc = lerp(1.08, 1.0, eio(seg(t, .3, 6.5)));
  ctx.save(); ctx.translate(MX, MY); ctx.scale(sc, sc);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const pRidge = eio(seg(t, .4, 2.0));
  const pBean = eio(seg(t, 1.7, 2.9));
  const outFade = 1 - seg(t, 2.0, 3.0);
  const pCrease = eio(seg(t, 2.4, 3.2));
  const pFill = eo(seg(t, 2.9, 3.8));
  const pSun = eo5(seg(t, 3.6, 5.0));
  const rPts = partial(ridge, pRidge);

  // 豆子外的山脊线（逐渐退去）
  if (outFade > 0 && pRidge > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-1000, -1000, 2000, 2000); ctx.ellipse(0, 0, RX, RY, ROT, 0, Math.PI * 2); ctx.clip('evenodd');
    ctx.globalAlpha = outFade; ctx.strokeStyle = COL.cream; ctx.lineWidth = 5; strokePts(rPts);
    ctx.restore();
  }

  // 豆子内部
  ctx.save(); beanPath(); ctx.clip();
  // 天空暖光
  if (pSun > 0) {
    const sy = lerp(140, -66, pSun);
    const sg = ctx.createRadialGradient(-8, sy, 0, -8, sy, 220);
    sg.addColorStop(0, `rgba(201,116,62,${.45 * pSun})`); sg.addColorStop(1, 'rgba(201,116,62,0)');
    ctx.fillStyle = sg; ctx.fillRect(-300, -300, 600, 600);
    ctx.fillStyle = COL.terra; ctx.beginPath(); ctx.arc(-8, sy, 42, 0, Math.PI * 2); ctx.fill();
  }
  // 山体填充（自下而上升起）
  if (pFill > 0) {
    ctx.save();
    const top = lerp(240, -100, pFill);
    ctx.beginPath(); ctx.rect(-300, top, 600, 600); ctx.clip();
    ctx.fillStyle = COL.cream;
    ctx.beginPath(); ridge.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.lineTo(430, 300); ctx.lineTo(-430, 300); ctx.closePath(); ctx.fill();
    // 主峰背阴面
    ctx.fillStyle = COL.shade;
    ctx.beginPath(); ctx.moveTo(42, -84); ctx.lineTo(150, 72); ctx.lineTo(74, 72); ctx.lineTo(56, -14); ctx.lineTo(48, -48); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-58, -36); ctx.lineTo(-18, 6); ctx.lineTo(-30, 30); ctx.lineTo(-44, -6); ctx.closePath(); ctx.fill();
    // 前排矮山
    ctx.fillStyle = COL.tan;
    ctx.beginPath(); front.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.lineTo(300, 300); ctx.lineTo(-300, 300); ctx.closePath(); ctx.fill();
    // 一条山路（豆子中缝的延续）
    ctx.strokeStyle = COL.bg; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(42, -84); ctx.bezierCurveTo(30, -30, 70, 10, 30, 60); ctx.bezierCurveTo(10, 90, 60, 120, 40, 200); ctx.globalAlpha = .55 * seg(t, 3.4, 4.0); ctx.stroke();
    ctx.restore();
  }
  // 山脊线（在内部）
  if (pRidge > 0) { ctx.strokeStyle = COL.cream; ctx.lineWidth = 5; strokePts(rPts); }
  // 中缝
  if (pCrease > 0) { ctx.strokeStyle = COL.cream; ctx.lineWidth = 5; strokePts(partial(creasePts, pCrease)); }
  // 光扫
  const sw = seg(t, 6.1, 7.2);
  if (sw > 0 && sw < 1) {
    const x = lerp(-320, 320, eio(sw));
    const lg = ctx.createLinearGradient(x - 90, 0, x + 90, 0);
    lg.addColorStop(0, 'rgba(255,245,225,0)'); lg.addColorStop(.5, 'rgba(255,245,225,0.28)'); lg.addColorStop(1, 'rgba(255,245,225,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = lg; ctx.translate(0, 0); ctx.rotate(.35); ctx.fillRect(-400, -400, 800, 800); ctx.restore();
  }
  ctx.restore();

  // 豆子轮廓：从豆尖向两侧画下
  if (pBean > 0) {
    ctx.strokeStyle = COL.cream; ctx.lineWidth = 7;
    const s = -Math.PI / 2;
    ctx.beginPath(); ctx.ellipse(0, 0, RX, RY, ROT, s, s + Math.PI * pBean); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, RX, RY, ROT, s, s - Math.PI * pBean, true); ctx.stroke();
  }
  ctx.restore();
}

function spacedWidth(str, sp) { let w = 0; for (const ch of str) w += ctx.measureText(ch).width + sp; return w - sp; }
function spacedText(str, cx, y, sp) {
  let x = cx - spacedWidth(str, sp) / 2;
  for (const ch of str) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; }
}

function drawType(t) {
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  // 中文字标：逐字浮现
  const chars = ['山', '野', '咖', '啡'], size = 100, gap = 132;
  ctx.font = `700 ${size}px ${SERIF}`;
  chars.forEach((ch, i) => {
    const p = eo(seg(t, 4.5 + i * .16, 5.4 + i * .16));
    if (p <= 0) return;
    const cxp = MX + (i - 1.5) * gap;
    ctx.save();
    ctx.globalAlpha = p; ctx.fillStyle = COL.cream;
    if (p < 1) ctx.filter = `blur(${((1 - p) * 10).toFixed(2)}px)`;
    const w = ctx.measureText(ch).width;
    ctx.fillText(ch, cxp - w / 2, 740 + (1 - p) * 26);
    ctx.restore();
  });

  // 英文 + 两侧细线
  const pe = eo(seg(t, 5.4, 6.4));
  if (pe > 0) {
    ctx.font = `400 28px ${LAT}`;
    const sp = lerp(26, 14, pe);
    const tw = spacedWidth('SHANYE COFFEE', sp);
    ctx.globalAlpha = pe; ctx.fillStyle = COL.gold;
    spacedText('SHANYE COFFEE', MX, 812, sp);
    const lw = 150 * eo(seg(t, 5.7, 6.6));
    ctx.fillRect(MX - tw / 2 - 30 - lw, 802, lw, 1.5);
    ctx.fillRect(MX + tw / 2 + 30, 802, lw, 1.5);
    // 小菱形
    [-1, 1].forEach(sg => {
      if (lw <= 0) return;
      const dx = MX + sg * (tw / 2 + 30 + lw + 10);
      ctx.save(); ctx.translate(dx, 802.5); ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -3, 6, 6); ctx.restore();
    });
  }
  // 标语
  const ps = eo(seg(t, 6.0, 6.8));
  if (ps > 0) {
    ctx.globalAlpha = ps; ctx.fillStyle = COL.mute; ctx.font = `400 30px ${SERIF}`;
    spacedText('一杯，从山里来', MX, 880 + (1 - ps) * 10, 12);
  }
  ctx.restore();
}

function render(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  drawBackground(t);
  drawMark(t);
  drawType(t);
  // 暗角
  const vg = ctx.createRadialGradient(MX, H / 2, 300, MX, H / 2, 1150);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // 颗粒
  ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // 开场从黑里亮起
  const fin = 1 - eo(seg(t, 0, .7));
  if (fin > 0) { ctx.fillStyle = `rgba(0,0,0,${fin})`; ctx.fillRect(0, 0, W, H); }
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

let t0 = null, paused = false;
window.__seek = ms => { paused = true; render(ms / 1000); };
function loop(now) {
  if (!paused) { if (t0 === null) t0 = now; render((now - t0) / 1000); }
  requestAnimationFrame(loop);
}
render(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
