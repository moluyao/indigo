<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机壁纸 - 极光星空</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
        }
        .container {
            position: relative;
            width: auto;
            max-width: 100%;
            line-height: 0;
        }
        canvas {
            display: block;
            width: auto;
            max-width: 100%;
            height: auto;
            border-radius: 0;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
        }
        @media (max-width: 1080px) {
            canvas {
                width: 100%;
                height: auto;
            }
        }
        .hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="wallpaper" width="1080" height="2340"></canvas>
    </div>
    <div class="hint">✦ 极光星空壁纸 ✦</div>
    <script>
        (function() {
            // ============ 固定种子随机数生成器（mulberry32） ============
            function mulberry32(seed) {
                let s = seed | 0;
                return function() {
                    s = (s + 0x6D2B79F5) | 0;
                    let t = Math.imul(s ^ (s >>> 15), 1 | s);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            // ============ Canvas 初始化 ============
            const canvas = document.getElementById('wallpaper');
            const ctx = canvas.getContext('2d');
            const W = 1080;
            const H = 2340;
            const SEED = 20240601;
            const rand = mulberry32(SEED);

            // ============ 工具函数 ============
            function lerp(a, b, t) { return a + (b - a) * t; }

            function lerpColor(c1, c2, t) {
                return {
                    r: Math.round(lerp(c1.r, c2.r, t)),
                    g: Math.round(lerp(c1.g, c2.g, t)),
                    b: Math.round(lerp(c1.b, c2.b, t))
                };
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 255, g: 255, b: 255 };
            }

            function rgbToStr(c) {
                return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
            }

            function rgbaStr(c, a) {
                return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
            }

            // ============ 1. 背景渐变 ============
            function drawBackground() {
                const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                bgGrad.addColorStop(0, '#050510');
                bgGrad.addColorStop(0.15, '#0a0a24');
                bgGrad.addColorStop(0.35, '#0f0f32');
                bgGrad.addColorStop(0.55, '#14143e');
                bgGrad.addColorStop(0.75, '#0d0d2a');
                bgGrad.addColorStop(0.9, '#08081a');
                bgGrad.addColorStop(1, '#040410');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // ============ 2. 星云（柔和彩色光晕） ============
            function drawNebula() {
                const nebulas = [
                    { x: 250, y: 500, radius: 300, color: 'rgba(60, 40, 120, 0.08)' },
                    { x: 700, y: 350, radius: 250, color: 'rgba(40, 60, 140, 0.07)' },
                    { x: 500, y: 700, radius: 350, color: 'rgba(80, 40, 100, 0.06)' },
                    { x: 850, y: 550, radius: 200, color: 'rgba(100, 50, 120, 0.07)' },
                    { x: 150, y: 800, radius: 250, color: 'rgba(30, 50, 110, 0.06)' },
                    { x: 600, y: 200, radius: 200, color: 'rgba(70, 50, 150, 0.05)' },
                    { x: 350, y: 350, radius: 220, color: 'rgba(50, 70, 140, 0.05)' },
                    { x: 900, y: 800, radius: 280, color: 'rgba(60, 30, 100, 0.06)' },
                ];
                for (const nb of nebulas) {
                    const grad = ctx.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.radius);
                    grad.addColorStop(0, nb.color);
                    grad.addColorStop(0.5, nb.color.replace(/[\d.]+\)$/, '0.03)'));
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(nb.x - nb.radius, nb.y - nb.radius, nb.radius * 2, nb.radius * 2);
                }
            }

            // ============ 3. 银河 ============
            function drawMilkyWay() {
                // 银河带状光晕
                const mwPath = [
                    { x: -100, y: 200 },
                    { x: 200, y: 450 },
                    { x: 350, y: 700 },
                    { x: 500, y: 950 },
                    { x: 420, y: 1150 },
                    { x: 300, y: 1300 },
                    { x: 150, y: 1420 },
                ];
                ctx.save();
                ctx.globalAlpha = 0.04;
                ctx.filter = 'blur(40px)';
                for (let i = 0; i < mwPath.length - 1; i++) {
                    const grad = ctx.createLinearGradient(mwPath[i].x, mwPath[i].y, mwPath[i + 1].x, mwPath[i + 1].y);
                    grad.addColorStop(0, 'rgba(200, 210, 255, 0.5)');
                    grad.addColorStop(0.5, 'rgba(180, 190, 240, 0.4)');
                    grad.addColorStop(1, 'rgba(160, 170, 220, 0.3)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(mwPath[i].x, mwPath[i].y, 120, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.filter = 'none';

                // 银河中的密集小星星
                for (let i = 0; i < 150; i++) {
                    const t = rand();
                    const idx = Math.floor(t * (mwPath.length - 1));
                    const segT = t * (mwPath.length - 1) - idx;
                    const bx = lerp(mwPath[idx].x, mwPath[idx + 1].x, segT);
                    const by = lerp(mwPath[idx].y, mwPath[idx + 1].y, segT);
                    const spreadX = (rand() - 0.5) * 160;
                    const spreadY = (rand() - 0.5) * 60;
                    const sx = bx + spreadX;
                    const sy = by + spreadY;
                    const sr = 0.4 + rand() * 1.6;
                    const alpha = 0.25 + rand() * 0.65;
                    const warmShift = rand();
                    let starColor;
                    if (warmShift < 0.3) {
                        starColor = 'rgba(220, 230, 255, ' + alpha + ')';
                    } else if (warmShift < 0.6) {
                        starColor = 'rgba(255, 240, 220, ' + alpha + ')';
                    } else {
                        starColor = 'rgba(200, 220, 255, ' + alpha + ')';
                    }
                    ctx.fillStyle = starColor;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ============ 4. 星星 ============
            function drawStars() {
                const starCount = 350;
                for (let i = 0; i < starCount; i++) {
                    const sx = rand() * W;
                    const sy = rand() * H * 0.72;
                    const sr = 0.3 + rand() * 1.9;
                    const alpha = 0.2 + rand() * 0.8;
                    const bright = rand();
                    let starColor;
                    if (bright < 0.1) {
                        starColor = 'rgba(255, 220, 180, ' + alpha + ')';
                    } else if (bright < 0.25) {
                        starColor = 'rgba(200, 220, 255, ' + alpha + ')';
                    } else if (bright < 0.5) {
                        starColor = 'rgba(255, 255, 255, ' + alpha + ')';
                    } else {
                        starColor = 'rgba(230, 240, 255, ' + alpha + ')';
                    }
                    ctx.fillStyle = starColor;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();

                    // 较大的星星添加十字光芒
                    if (sr > 1.6 && bright > 0.6) {
                        const glowAlpha = alpha * 0.5;
                        const glowLen = sr * 6;
                        const glowW = sr * 0.5;
                        const glowGrad = ctx.createLinearGradient(sx - glowLen, sy, sx + glowLen, sy);
                        glowGrad.addColorStop(0, 'rgba(255,255,255,0)');
                        glowGrad.addColorStop(0.5, 'rgba(255,255,255,' + glowAlpha + ')');
                        glowGrad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = glowGrad;
                        ctx.fillRect(sx - glowLen, sy - glowW / 2, glowLen * 2, glowW);
                        const glowGradV = ctx.createLinearGradient(sx, sy - glowLen, sx, sy + glowLen);
                        glowGradV.addColorStop(0, 'rgba(255,255,255,0)');
                        glowGradV.addColorStop(0.5, 'rgba(255,255,255,' + glowAlpha + ')');
                        glowGradV.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = glowGradV;
                        ctx.fillRect(sx - glowW / 2, sy - glowLen, glowW, glowLen * 2);
                    }
                }
            }

            // ============ 5. 极光 ============
            function drawAurora() {
                // 极光带1 - 青绿色主极光
                drawAuroraBand(
                    [{ x: -50, y: 500 }, { x: 300, y: 380 }, { x: 550, y: 520 }, { x: 750, y: 420 }, { x: 950, y: 550 },
                        { x: 1100, y: 480 }
                    ],
                    ['rgba(0,255,170,0.30)', 'rgba(0,200,180,0.25)', 'rgba(0,140,200,0.20)', 'rgba(0,180,220,0.15)'],
                    190, 0.9
                );

                // 极光带2 - 紫蓝色次极光
                drawAuroraBand(
                    [{ x: 100, y: 720 }, { x: 350, y: 580 }, { x: 600, y: 680 }, { x: 800, y: 560 }, { x: 1000, y: 650 },
                        { x: 1150, y: 580 }
                    ],
                    ['rgba(120,68,255,0.25)', 'rgba(170,68,220,0.20)', 'rgba(100,80,255,0.18)', 'rgba(140,50,200,0.12)'],
                    145, 0.85
                );

                // 极光带3 - 粉橙色柔和极光
                drawAuroraBand(
                    [{ x: 200, y: 600 }, { x: 450, y: 480 }, { x: 700, y: 580 }, { x: 900, y: 470 }, { x: 1080, y: 540 }],
                    ['rgba(255,136,170,0.18)', 'rgba(255,170,102,0.15)', 'rgba(255,120,140,0.12)',
                        'rgba(255,150,100,0.10)'
                    ],
                    100, 0.75
                );

                // 极光带4 - 微弱蓝绿色远处极光
                drawAuroraBand(
                    [{ x: -50, y: 400 }, { x: 200, y: 320 }, { x: 500, y: 400 }, { x: 800, y: 350 }, { x: 1100, y: 400 }],
                    ['rgba(0,220,255,0.12)', 'rgba(0,180,220,0.10)', 'rgba(0,200,240,0.08)'],
                    80, 0.55
                );
            }

            function drawAuroraBand(points, colors, lineWidth, maxAlpha) {
                if (points.length < 3) return;

                // 采样贝塞尔曲线
                const samples = [];
                const numSamples = 80;
                for (let i = 0; i < numSamples; i++) {
                    const t = i / (numSamples - 1);
                    samples.push(catmullRom(points, t));
                }

                // 绘制主线条（多层叠加模拟发光）
                const layers = [
                    { widthMul: 1.0, alphaMul: 0.9 },
                    { widthMul: 0.65, alphaMul: 0.7 },
                    { widthMul: 0.4, alphaMul: 0.8 },
                    { widthMul: 0.2, alphaMul: 0.9 },
                ];

                for (const layer of layers) {
                    const lw = lineWidth * layer.widthMul;
                    ctx.save();
                    ctx.globalAlpha = maxAlpha * layer.alphaMul;
                    ctx.globalCompositeOperation = 'lighter';

                    // 创建渐变
                    const gradStart = samples[0];
                    const gradEnd = samples[samples.length - 1];
                    const lineGrad = ctx.createLinearGradient(gradStart.x, gradStart.y, gradEnd.x, gradEnd.y);
                    for (let ci = 0; ci < colors.length; ci++) {
                        lineGrad.addColorStop(ci / (colors.length - 1), colors[ci]);
                    }

                    ctx.strokeStyle = lineGrad;
                    ctx.lineWidth = lw;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(samples[0].x, samples[0].y);
                    for (let i = 1; i < samples.length; i++) {
                        ctx.lineTo(samples[i].x, samples[i].y);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                // 添加光晕圆点
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const numGlows = 25;
                for (let i = 0; i < numGlows; i++) {
                    const t = i / (numGlows - 1) + (rand() - 0.5) * 0.015;
                    const clampedT = Math.max(0, Math.min(1, t));
                    const pt = catmullRom(points, clampedT);
                    const glowR = lineWidth * (0.2 + rand() * 0.3);
                    const glowAlpha = maxAlpha * (0.15 + rand() * 0.25);
                    const colorIdx = Math.floor(rand() * colors.length);
                    const colStr = colors[colorIdx];
                    // 解析rgba颜色，替换透明度
                    const match = colStr.match(/rgba\((\d+),(\d+),(\d+),([\d.]+)\)/);
                    if (match) {
                        const r = parseInt(match[1]);
                        const g = parseInt(match[2]);
                        const b = parseInt(match[3]);
                        const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, glowR);
                        grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + glowAlpha + ')');
                        grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            // Catmull-Rom 曲线插值
            function catmullRom(points, t) {
                const numPoints = points.length;
                if (numPoints < 2) return points[0];
                const seg = t * (numPoints - 1);
                const idx = Math.min(Math.floor(seg), numPoints - 2);
                const localT = seg - idx;
                const p0 = points[Math.max(0, idx - 1)];
                const p1 = points[idx];
                const p2 = points[Math.min(numPoints - 1, idx + 1)];
                const p3 = points[Math.min(numPoints - 1, idx + 2)];
                const t2 = localT * localT;
                const t3 = t2 * localT;
                const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * localT +
                    (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                    (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * localT +
                    (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                    (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
                return { x: x, y: y };
            }

            // ============ 6. 月亮 ============
            function drawMoon() {
                const mx = 800;
                const my = 200;
                const mr = 55;

                // 月亮光晕
                const haloGrad = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4.5);
                haloGrad.addColorStop(0, 'rgba(255,250,240,0.35)');
                haloGrad.addColorStop(0.2, 'rgba(255,245,230,0.18)');
                haloGrad.addColorStop(0.45, 'rgba(255,240,220,0.07)');
                haloGrad.addColorStop(0.7, 'rgba(255,235,210,0.02)');
                haloGrad.addColorStop(1, 'rgba(255,230,200,0)');
                ctx.fillStyle = haloGrad;
                ctx.beginPath();
                ctx.arc(mx, my, mr * 4.5, 0, Math.PI * 2);
                ctx.fill();

                // 月亮本体
                const moonGrad = ctx.createRadialGradient(mx - mr * 0.25, my - mr * 0.25, mr * 0.1, mx, my, mr);
                moonGrad.addColorStop(0, '#fffef8');
                moonGrad.addColorStop(0.45, '#f8f2e0');
                moonGrad.addColorStop(0.75, '#ebe4d0');
                moonGrad.addColorStop(1, '#d8d0bc');
                ctx.fillStyle = moonGrad;
                ctx.beginPath();
                ctx.arc(mx, my, mr, 0, Math.PI * 2);
                ctx.fill();

                // 月海（暗色斑点）
                const marias = [
                    { dx: -15, dy: -10, rx: 18, ry: 12, alpha: 0.18 },
                    { dx: 8, dy: 12, rx: 14, ry: 9, alpha: 0.15 },
                    { dx: 12, dy: -15, rx: 10, ry: 7, alpha: 0.13 },
                    { dx: -5, dy: 20, rx: 12, ry: 8, alpha: 0.16 },
                    { dx: -22, dy: 8, rx: 9, ry: 6, alpha: 0.12 },
                    { dx: 0, dy: -3, rx: 8, ry: 5, alpha: 0.10 },
                ];
                for (const maria of marias) {
                    const mgx = mx + maria.dx;
                    const mgy = my + maria.dy;
                    const mgrad = ctx.createRadialGradient(mgx - maria.rx * 0.3, mgy - maria.ry * 0.3, 0, mgx, mgy, maria
                        .rx);
                    mgrad.addColorStop(0, 'rgba(180,175,160,' + maria.alpha + ')');
                    mgrad.addColorStop(0.6, 'rgba(190,185,170,' + (maria.alpha * 0.6) + ')');
                    mgrad.addColorStop(1, 'rgba(200,195,180,0)');
                    ctx.fillStyle = mgrad;
                    ctx.beginPath();
                    ctx.ellipse(mgx, mgy, maria.rx, maria.ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 月亮边缘柔光
                const edgeGrad = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 1.15);
                edgeGrad.addColorStop(0, 'rgba(255,250,240,0.25)');
                edgeGrad.addColorStop(0.5, 'rgba(255,245,230,0.08)');
                edgeGrad.addColorStop(1, 'rgba(255,240,220,0)');
                ctx.fillStyle = edgeGrad;
                ctx.beginPath();
                ctx.arc(mx, my, mr * 1.15, 0, Math.PI * 2);
                ctx.fill();
            }

            // ============ 7. 山峦 ============
            function drawMountains() {
                // 远山（最浅、最远）
                drawMountainLayer(
                    [
                        { x: 0, y: 1750 }, { x: 80, y: 1650 }, { x: 160, y: 1720 }, { x: 250, y: 1600 },
                        { x: 340, y: 1680 }, { x: 420, y: 1580 }, { x: 520, y: 1660 }, { x: 600, y: 1550 },
                        { x: 700, y: 1620 }, { x: 780, y: 1520 }, { x: 870, y: 1590 }, { x: 950, y: 1540 },
                        { x: 1020, y: 1610 }, { x: 1080, y: 1550 }
                    ],
                    'rgba(25,25,55,0.85)', 1650
                );

                // 中山（中间层次）
                drawMountainLayer(
                    [
                        { x: 0, y: 1900 }, { x: 100, y: 1780 }, { x: 200, y: 1860 }, { x: 320, y: 1740 },
                        { x: 430, y: 1820 }, { x: 550, y: 1700 }, { x: 660, y: 1790 }, { x: 780, y: 1670 },
                        { x: 890, y: 1750 }, { x: 1000, y: 1690 }, { x: 1080, y: 1730 }
                    ],
                    'rgba(15,15,38,0.92)', 1800
                );

                // 近山（最深、最近）
                drawMountainLayer(
                    [
                        { x: 0, y: 2100 }, { x: 150, y: 1950 }, { x: 300, y: 2040 }, { x: 450, y: 1900 },
                        { x: 600, y: 1990 }, { x: 750, y: 1860 }, { x: 880, y: 1960 }, { x: 1000, y: 1880 },
                        { x: 1080, y: 1930 }
                    ],
                    'rgba(8,8,22,0.97)', 2000
                );

                // 最近山层
                drawMountainLayer(
                    [
                        { x: 0, y: 2280 }, { x: 200, y: 2120 }, { x: 400, y: 2220 }, { x: 600, y: 2080 },
                        { x: 800, y: 2180 }, { x: 1000, y: 2100 }, { x: 1080, y: 2150 }
                    ],
                    'rgba(3,3,12,1)', 2150
                );
            }

            function drawMountainLayer(peaks, color, baseY) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(peaks[0].x, peaks[0].y);
                for (let i = 1; i < peaks.length; i++) {
                    const prevX = peaks[i - 1].x;
                    const prevY = peaks[i - 1].y;
                    const currX = peaks[i].x;
                    const currY = peaks[i].y;
                    const midX = (prevX + currX) / 2;
                    // 使用二次贝塞尔曲线使山脊更自然
                    ctx.quadraticCurveTo(prevX, prevY, midX, (prevY + currY) / 2);
                    ctx.quadraticCurveTo(currX, currY, currX, currY);
                }
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.closePath();
                ctx.fill();

                // 山脊线高光
                ctx.save();
                ctx.globalAlpha = 0.15;
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(peaks[0].x, peaks[0].y);
                for (let i = 1; i < peaks.length; i++) {
                    const prevX = peaks[i - 1].x;
                    const prevY = peaks[i - 1].y;
                    const currX = peaks[i].x;
                    const currY = peaks[i].y;
                    const midX = (prevX + currX) / 2;
                    ctx.quadraticCurveTo(prevX, prevY, midX, (prevY + currY) / 2);
                    ctx.quadraticCurveTo(currX, currY, currX, currY);
                }
                ctx.stroke();
                ctx.restore();
            }

            // ============ 8. 山间雾气 ============
            function drawMist() {
                const mistConfigs = [
                    { x: 300, y: 1750, rx: 350, ry: 60, alpha: 0.05 },
                    { x: 700, y: 1700, rx: 400, ry: 70, alpha: 0.045 },
                    { x: 500, y: 1850, rx: 450, ry: 55, alpha: 0.04 },
                    { x: 200, y: 1950, rx: 300, ry: 50, alpha: 0.05 },
                    { x: 800, y: 1900, rx: 350, ry: 55, alpha: 0.035 },
                    { x: 550, y: 2000, rx: 500, ry: 45, alpha: 0.03 },
                    { x: 150, y: 2050, rx: 280, ry: 40, alpha: 0.04 },
                    { x: 900, y: 2000, rx: 300, ry: 45, alpha: 0.03 },
                    { x: 400, y: 2150, rx: 400, ry: 40, alpha: 0.025 },
                ];
                for (const mc of mistConfigs) {
                    const grad = ctx.createRadialGradient(mc.x, mc.y, 0, mc.x, mc.y, mc.rx);
                    grad.addColorStop(0, 'rgba(220,225,240,' + mc.alpha + ')');
                    grad.addColorStop(0.5, 'rgba(215,220,235,' + (mc.alpha * 0.6) + ')');
                    grad.addColorStop(1, 'rgba(210,215,230,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(mc.x, mc.y, mc.rx, mc.ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ============ 9. 光尘粒子（萤火虫） ============
            function drawFireflies() {
                const fireflyCount = 60;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < fireflyCount; i++) {
                    const fx = rand() * W;
                    const fy = 1300 + rand() * 700;
                    const fr = 1.5 + rand() * 4;
                    const alpha = 0.15 + rand() * 0.5;
                    const hue = rand();
                    let fColor;
                    if (hue < 0.33) {
                        fColor = 'rgba(180,255,220,' + alpha + ')';
                    } else if (hue < 0.66) {
                        fColor = 'rgba(220,200,255,' + alpha + ')';
                    } else {
                        fColor = 'rgba(255,230,180,' + alpha + ')';
                    }
                    const fgrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 3);
                    fgrad.addColorStop(0, fColor);
                    fgrad.addColorStop(0.3, fColor.replace(/[\d.]+\)$/, (alpha * 0.5) + ')'));
                    fgrad.addColorStop(1, fColor.replace(/[\d.]+\)$/, '0)'));
                    ctx.fillStyle = fgrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, fr * 3, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心亮点
                    ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.8) + ')';
                    ctx.beginPath();
                    ctx.arc(fx, fy, fr * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ============ 10. 流星 ============
            function drawMeteors() {
                const meteors = [
                    { x1: 150, y1: 250, x2: 60, y2: 380, width: 3.5, color: 'rgba(255,255,255,0.9)' },
                    { x1: 550, y1: 120, x2: 480, y2: 220, width: 2.5, color: 'rgba(220,230,255,0.7)' },
                    { x1: 350, y1: 50, x2: 310, y2: 130, width: 2.0, color: 'rgba(255,240,220,0.6)' },
                ];
                for (const m of meteors) {
                    const dx = m.x2 - m.x1;
                    const dy = m.y2 - m.y1;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    const nx = dx / len;
                    const ny = dy / len;

                    // 流星头
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const headGrad = ctx.createRadialGradient(m.x1, m.y1, 0, m.x1, m.y1, m.width * 3);
                    headGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
                    headGrad.addColorStop(0.3, 'rgba(255,240,220,0.5)');
                    headGrad.addColorStop(1, 'rgba(255,220,180,0)');
                    ctx.fillStyle = headGrad;
                    ctx.beginPath();
                    ctx.arc(m.x1, m.y1, m.width * 3, 0, Math.PI * 2);
                    ctx.fill();

                    // 流星尾
                    const tailGrad = ctx.createLinearGradient(m.x1, m.y1, m.x2, m.y2);
                    tailGrad.addColorStop(0, m.color);
                    tailGrad.addColorStop(0.4, m.color.replace(/[\d.]+\)$/, '0.35)'));
                    tailGrad.addColorStop(1, m.color.replace(/[\d.]+\)$/, '0)'));
                    ctx.strokeStyle = tailGrad;
                    ctx.lineWidth = m.width;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(m.x1, m.y1);
                    ctx.lineTo(m.x2, m.y2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // ============ 11. 暗角效果 ============
            function drawVignette() {
                const vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
                vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
                vigGrad.addColorStop(0.55, 'rgba(0,0,0,0.02)');
                vigGrad.addColorStop(0.8, 'rgba(0,0,0,0.12)');
                vigGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
                ctx.fillStyle = vigGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // ============ 12. 噪点纹理 ============
            function drawNoise() {
                const noiseCount = 8000;
                const noiseRand = mulberry32(SEED + 999);
                for (let i = 0; i < noiseCount; i++) {
                    const nx = noiseRand() * W;
                    const ny = noiseRand() * H;
                    const na = 0.01 + noiseRand() * 0.035;
                    const nb = Math.floor(180 + noiseRand() * 75);
                    ctx.fillStyle = 'rgba(' + nb + ',' + nb + ',' + nb + ',' + na + ')';
                    ctx.fillRect(nx, ny, 1, 1);
                }
            }

            // ============ 主渲染函数 ============
            function renderWallpaper() {
                // 重置
                ctx.clearRect(0, 0, W, H);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
                ctx.filter = 'none';

                // 按照从远到近的顺序绘制
                drawBackground(); // 1. 背景渐变
                drawNebula(); // 2. 星云
                drawMilkyWay(); // 3. 银河
                drawStars(); // 4. 星星
                drawAurora(); // 5. 极光
                drawMoon(); // 6. 月亮
                drawMeteors(); // 7. 流星
                drawMountains(); // 8. 山峦
                drawMist(); // 9. 山间雾气
                drawFireflies(); // 10. 光尘
                drawVignette(); // 11. 暗角
                drawNoise(); // 12. 噪点
            }

            // ============ 执行渲染 ============
            renderWallpaper();

            // ============ 暴露window.__seek（T1静态壁纸无动画，但技术上兼容） ============
            window.__seek = function(ms) {
                // 静态壁纸始终渲染相同画面，ms参数被忽略
                renderWallpaper();
                return { rendered: true, atMs: ms || 0, static: true };
            };

            // 确保初始渲染正确
            console.log('✅ 手机壁纸已渲染完成 (1080×2340)');
            console.log('💡 使用 window.__seek(ms) 可重新渲染静态画面');
        })();
    </script>
