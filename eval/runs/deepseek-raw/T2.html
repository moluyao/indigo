<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星辉 · 粒子交响曲</title>
    <style>
        :root {
            --bg: #05070d;
            --panel: #0d121f;
            --text: #d0d8f0;
            --accent: #e8c877;
            --btn-active: #1a2436;
            --btn-hover: #162036;
            --border: #1e2a42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 画布容器 */
        .canvas-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 4px 24px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(100, 140, 200, 0.06);
            transition: opacity 0.35s ease;
            opacity: 1;
        }
        canvas.hidden-canvas {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        /* 顶部控制栏 */
        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            background: rgba(10, 15, 28, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        .controls .btn {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 10px 20px;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            white-space: nowrap;
            outline: none;
            font-family: inherit;
        }
        .controls .btn:hover {
            background: var(--btn-hover);
            color: #fff;
        }
        .controls .btn.active {
            background: var(--btn-active);
            color: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(232, 200, 119, 0.25), 0 0 20px rgba(232, 200, 119, 0.1);
        }
        .controls .btn .badge {
            display: inline-block;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2px 7px;
            margin-left: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #aaa;
        }
        .controls .btn.active .badge {
            background: rgba(232, 200, 119, 0.18);
            color: var(--accent);
        }

        .btn-play {
            background: rgba(255, 255, 255, 0.06) !important;
            min-width: 44px;
            text-align: center;
            padding: 10px 14px !important;
            font-size: 14px !important;
            border-radius: 50% !important;
            aspect-ratio: 1;
        }
        .btn-play:hover {
            background: rgba(255, 255, 255, 0.12) !important;
        }

        /* 进度条 */
        .progress-bar {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: min(500px, 70vw);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(10, 15, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }
        .progress-bar .time-label {
            font-size: 12px;
            font-weight: 500;
            color: #aab4d0;
            min-width: 42px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s ease;
        }
        .progress-track:hover {
            height: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e8c877, #f0dca0, #c9a84c);
            border-radius: 3px;
            transition: width 0.05s linear;
            box-shadow: 0 0 12px rgba(232, 200, 119, 0.3);
        }
        .progress-track .seek-hint {
            position: absolute;
            top: -24px;
            font-size: 10px;
            color: #8899bb;
            letter-spacing: 0.3px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .controls {
                top: 10px;
                gap: 4px;
                padding: 6px 8px;
                border-radius: 30px;
            }
            .controls .btn {
                font-size: 11px;
                padding: 7px 12px;
                border-radius: 22px;
            }
            .controls .btn .badge {
                font-size: 8px;
                padding: 1px 5px;
                margin-left: 3px;
            }
            .btn-play {
                padding: 7px 10px !important;
                font-size: 11px !important;
            }
            .progress-bar {
                bottom: 16px;
                padding: 7px 12px;
                border-radius: 24px;
                width: min(380px, 85vw);
            }
            .progress-bar .time-label {
                font-size: 10px;
                min-width: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- T1 静态画布 1080x2340 -->
        <canvas id="canvasT1" width="1080" height="2340" class="hidden-canvas"></canvas>
        <!-- T2 动画画布 1920x1080 -->
        <canvas id="canvasT2" width="1920" height="1080"></canvas>
        <!-- T3 动画画布 1920x1080 -->
        <canvas id="canvasT3" width="1920" height="1080" class="hidden-canvas"></canvas>
    </div>

    <!-- 控制栏 -->
    <div class="controls" id="controls">
        <button class="btn" data-mode="t1">T1 <span class="badge">1080×2340</span></button>
        <button class="btn active" data-mode="t2">T2 <span class="badge">10s 循环</span></button>
        <button class="btn" data-mode="t3">T3 <span class="badge">15s</span></button>
        <button class="btn btn-play" id="btnPlay" title="播放/暂停">⏸</button>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar" id="progressBar">
        <span class="time-label" id="timeCurrent">0.0s</span>
        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="time-label" id="timeTotal">10.0s</span>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== 工具函数 ====================

            // 固定种子随机数生成器 mulberry32
            function mulberry32(seed) {
                let state = seed >>> 0;
                return function() {
                    state = (state * 1664525 + 1013904223) >>> 0;
                    return state / 4294967296;
                };
            }

            // 生成字符串哈希种子
            function hashSeed(str) {
                let h = 2166136261;
                for (let i = 0; i < str.length; i++) {
                    h = (h * 16777619) ^ str.charCodeAt(i);
                }
                return h >>> 0;
            }

            // 平滑步进
            function smoothstep(t) {
                t = Math.max(0, Math.min(1, t));
                return t * t * (3 - 2 * t);
            }

            // 缓入缓出
            function easeInOutCubic(t) {
                t = Math.max(0, Math.min(1, t));
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            // 线性插值
            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            // HSL 转 CSS 颜色字符串
            function hslToCss(h, s, l, a) {
                a = a !== undefined ? a : 1;
                return `hsla(${h % 360},${s}%,${l}%,${a})`;
            }

            // 十六进制颜色转 RGB 分量
            function hexToRgb(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return { r, g, b };
            }

            // 生成径向渐变缓存
            function createRadialGradient(ctx, x, y, r, colorStops) {
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                for (const stop of colorStops) {
                    grad.addColorStop(stop.pos, stop.color);
                }
                return grad;
            }

            // ==================== 全局状态 ====================

            const canvasT1 = document.getElementById('canvasT1');
            const canvasT2 = document.getElementById('canvasT2');
            const canvasT3 = document.getElementById('canvasT3');
            const ctxT1 = canvasT1.getContext('2d');
            const ctxT2 = canvasT2.getContext('2d');
            const ctxT3 = canvasT3.getContext('2d');

            const T1_W = 1080,
                T1_H = 2340;
            const T2_W = 1920,
                T2_H = 1080;
            const T3_W = 1920,
                T3_H = 1080;

            const T2_DURATION = 10000; // 10秒
            const T3_DURATION = 15000; // 15秒

            let currentMode = 't2';
            let isPlaying = true;
            let currentTime = 0;
            let lastFrameTime = null;
            let animFrameId = null;

            // ==================== 粒子数据初始化 ====================

            // T2 粒子系统
            const t2RNG = mulberry32(hashSeed('T2_star_orbit'));
            const t2Particles = [];
            const T2_LAYERS = [
                { count: 22, radius: 520, tilt: 28, speed: 1, hueMin: 35, hueMax: 55, sizeBase: 3.2, sizeVar: 1.5,
                    light: 68 },
                { count: 30, radius: 440, tilt: 42, speed: 2, hueMin: 20, hueMax: 45, sizeBase: 2.7, sizeVar: 1.2,
                    light: 64 },
                { count: 26, radius: 365, tilt: 58, speed: 3, hueMin: 15, hueMax: 38, sizeBase: 3.0, sizeVar: 1.8,
                    light: 60 },
                { count: 34, radius: 285, tilt: 15, speed: 1, hueMin: 190, hueMax: 215, sizeBase: 2.3, sizeVar: 1.0,
                    light: 70 },
                { count: 20, radius: 215, tilt: 68, speed: 2, hueMin: 175, hueMax: 205, sizeBase: 2.6, sizeVar: 1.3,
                    light: 66 },
                { count: 28, radius: 155, tilt: 35, speed: 3, hueMin: 200, hueMax: 230, sizeBase: 2.2, sizeVar: 0.9,
                    light: 72 },
                { count: 18, radius: 105, tilt: 50, speed: 1, hueMin: 25, hueMax: 50, sizeBase: 2.8, sizeVar: 1.4,
                    light: 62 },
                { count: 24, radius: 60, tilt: 22, speed: 2, hueMin: 180, hueMax: 210, sizeBase: 2.4, sizeVar: 1.0,
                    light: 68 },
            ];

            for (let li = 0; li < T2_LAYERS.length; li++) {
                const layer = T2_LAYERS[li];
                const count = layer.count;
                const radius = layer.radius;
                const tilt = layer.tilt;
                const speed = layer.speed;
                const hueMin = layer.hueMin;
                const hueMax = layer.hueMax;
                const sizeBase = layer.sizeBase;
                const sizeVar = layer.sizeVar;
                const light = layer.light;
                for (let i = 0; i < count; i++) {
                    const phase = t2RNG() * Math.PI * 2;
                    const randOffset = {
                        x: (t2RNG() - 0.5) * 25,
                        y: (t2RNG() - 0.5) * 25,
                        z: (t2RNG() - 0.5) * 25,
                    };
                    const hue = lerp(hueMin, hueMax, t2RNG());
                    const size = sizeBase + t2RNG() * sizeVar;
                    const flashOffset = t2RNG() * Math.PI * 2;
                    const flashSpeed = 2 + Math.floor(t2RNG() * 4);
                    t2Particles.push({
                        layer: li,
                        radius,
                        tilt: tilt * Math.PI / 180,
                        speed,
                        phase,
                        offset: randOffset,
                        hue,
                        sat: 70 + t2RNG() * 25,
                        light: light + t2RNG() * 10,
                        size,
                        flashOffset,
                        flashSpeed,
                        alphaBase: 0.6 + t2RNG() * 0.4,
                    });
                }
            }

            // T2 背景星点
            const t2Stars = [];
            for (let i = 0; i < 280; i++) {
                t2Stars.push({
                    x: t2RNG() * T2_W,
                    y: t2RNG() * T2_H,
                    size: 0.4 + t2RNG() * 1.8,
                    alpha: 0.15 + t2RNG() * 0.5,
                    twinkleOffset: t2RNG() * Math.PI * 2,
                    twinkleSpeed: 1 + Math.floor(t2RNG() * 5),
                });
            }

            // T3 粒子系统 - 螺旋星云
            const t3RNG = mulberry32(hashSeed('T3_galaxy_nova'));
            const t3Particles = [];
            const T3_ARM_COUNT = 4;
            const T3_PARTICLES_PER_ARM = 150;
            const T3_TOTAL = T3_ARM_COUNT * T3_PARTICLES_PER_ARM;

            for (let arm = 0; arm < T3_ARM_COUNT; arm++) {
                const armAngleOffset = (arm / T3_ARM_COUNT) * Math.PI * 2;
                for (let i = 0; i < T3_PARTICLES_PER_ARM; i++) {
                    const t = i / T3_PARTICLES_PER_ARM;
                    const theta = t * Math.PI * 4.2 + armAngleOffset;
                    const baseRadius = 40 + t * 500;
                    const radiusJitter = (t3RNG() - 0.5) * 60 * t;
                    const angleJitter = (t3RNG() - 0.5) * 0.25 * (1 - t);
                    const radialOffset = (t3RNG() - 0.5) * 30;
                    const hue = lerp(40, 260, t3RNG());
                    const size = 1.5 + t3RNG() * 3.2;
                    t3Particles.push({
                        arm,
                        theta,
                        baseRadius: baseRadius + radiusJitter + radialOffset,
                        angleOffset: angleJitter,
                        armOffset: armAngleOffset,
                        hue,
                        sat: 75 + t3RNG() * 20,
                        light: 55 + t3RNG() * 25,
                        size,
                        alphaBase: 0.5 + t3RNG() * 0.5,
                        noiseSeed: t3RNG() * Math.PI * 2,
                    });
                }
            }

            // T3 背景星点
            const t3Stars = [];
            for (let i = 0; i < 300; i++) {
                t3Stars.push({
                    x: t3RNG() * T3_W,
                    y: t3RNG() * T3_H,
                    size: 0.3 + t3RNG() * 1.4,
                    alpha: 0.12 + t3RNG() * 0.4,
                    twinkleOffset: t3RNG() * Math.PI * 2,
                    twinkleSpeed: 1 + Math.floor(t3RNG() * 6),
                });
            }

            // T1 静态粒子数据
            const t1RNG = mulberry32(hashSeed('T1_poster'));
            const t1Particles = [];
            const T1_CENTER_X = T1_W / 2;
            const T1_CENTER_Y = T1_H * 0.42;
            const T1_LAYERS = [
                { count: 40, radius: 420, angleOffset: 0, spread: 0.12 },
                { count: 32, radius: 350, angleOffset: Math.PI / 40, spread: 0.18 },
                { count: 36, radius: 280, angleOffset: Math.PI / 20, spread: 0.22 },
                { count: 28, radius: 210, angleOffset: Math.PI / 15, spread: 0.28 },
                { count: 30, radius: 140, angleOffset: Math.PI / 10, spread: 0.32 },
                { count: 22, radius: 75, angleOffset: Math.PI / 7, spread: 0.35 },
                { count: 16, radius: 30, angleOffset: Math.PI / 5, spread: 0.45 },
            ];

            for (let li = 0; li < T1_LAYERS.length; li++) {
                const layer = T1_LAYERS[li];
                const count = layer.count;
                const radius = layer.radius;
                const angleOff = layer.angleOffset;
                const spread = layer.spread;
                for (let i = 0; i < count; i++) {
                    const baseAngle = (i / count) * Math.PI * 2 + angleOff;
                    const angle = baseAngle + (t1RNG() - 0.5) * spread * 2;
                    const r = radius + (t1RNG() - 0.5) * 40;
                    const x = T1_CENTER_X + Math.cos(angle) * r;
                    const y = T1_CENTER_Y + Math.sin(angle) * r * 0.72;
                    const hue = lerp(38, 215, t1RNG());
                    const size = 2.0 + t1RNG() * 4.5;
                    const alpha = 0.55 + t1RNG() * 0.45;
                    t1Particles.push({
                        x,
                        y,
                        baseAngle,
                        radius: r,
                        hue,
                        sat: 70 + t1RNG() * 25,
                        light: 58 + t1RNG() * 22,
                        size,
                        alpha,
                        connectionGroup: li,
                    });
                }
            }

            // T1 连线数据
            const t1Connections = [];
            for (let li = 0; li < T1_LAYERS.length; li++) {
                const groupParticles = t1Particles.filter(p => p.connectionGroup === li);
                const count = groupParticles.length;
                for (let i = 0; i < count; i++) {
                    const next = (i + 1) % count;
                    const next2 = (i + 3) % count;
                    const next3 = (i + 7) % count;
                    t1Connections.push([groupParticles[i], groupParticles[next]]);
                    t1Connections.push([groupParticles[i], groupParticles[next2]]);
                    t1Connections.push([groupParticles[i], groupParticles[next3]]);
                }
            }
            // 跨层连接
            for (let li = 0; li < T1_LAYERS.length - 1; li++) {
                const groupA = t1Particles.filter(p => p.connectionGroup === li);
                const groupB = t1Particles.filter(p => p.connectionGroup === li + 1);
                const pairs = Math.min(groupA.length, groupB.length);
                for (let i = 0; i < pairs; i += 2) {
                    t1Connections.push([groupA[i], groupB[i]]);
                }
            }

            // ==================== 渲染函数 ====================

            // --- T2 渲染 (10秒循环) ---
            function renderT2(timeMs, ctx) {
                const w = T2_W,
                    h = T2_H;
                const t = timeMs % T2_DURATION;
                const progress = t / T2_DURATION; // 0..1

                // 清屏
                ctx.fillStyle = '#04070e';
                ctx.fillRect(0, 0, w, h);

                // 深空渐变背景
                const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 80, w / 2, h / 2, 1000);
                bgGrad.addColorStop(0, '#0a1122');
                bgGrad.addColorStop(0.45, '#060a16');
                bgGrad.addColorStop(1, '#020408');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // 背景星点（闪烁）
                for (const star of t2Stars) {
                    const twinkle = 0.5 + 0.5 * Math.sin(t / 1000 * Math.PI * 2 * star.twinkleSpeed / 5 + star
                        .twinkleOffset);
                    const alpha = star.alpha * (0.4 + 0.6 * twinkle);
                    ctx.fillStyle = `rgba(200,215,240,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 中心发光核心
                const corePulse = 0.5 + 0.5 * Math.sin(t / 1000 * Math.PI * 2 * 2); // 2次脉冲周期
                const coreR = 50 + corePulse * 18;
                const coreGrad = createRadialGradient(ctx, w / 2, h / 2, coreR * 2.5, [
                    { pos: 0, color: 'rgba(255,245,220,0.95)' },
                    { pos: 0.2, color: 'rgba(255,220,160,0.55)' },
                    { pos: 0.5, color: 'rgba(232,180,100,0.2)' },
                    { pos: 1, color: 'rgba(180,120,60,0)' },
                ]);
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, coreR * 2.5, 0, Math.PI * 2);
                ctx.fill();
                // 核心亮点
                ctx.fillStyle = 'rgba(255,252,240,0.9)';
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, coreR * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // 整体旋转角度（10秒一圈）
                const globalRotation = progress * Math.PI * 2;

                // 计算所有粒子的2D投影位置
                const projected = [];
                const perspective = 0.0009;
                const depthRange = 350;

                for (const p of t2Particles) {
                    // 轨道角度（10秒内p.speed圈）
                    const orbitAngle = progress * Math.PI * 2 * p.speed + p.phase;

                    // 3D位置（轨道在XZ平面，然后倾斜）
                    let x3d = Math.cos(orbitAngle) * p.radius + p.offset.x;
                    let y3d = 0 + p.offset.y;
                    let z3d = Math.sin(orbitAngle) * p.radius + p.offset.z;

                    // 应用倾斜（绕X轴旋转）
                    const cosTilt = Math.cos(p.tilt);
                    const sinTilt = Math.sin(p.tilt);
                    const yTilted = y3d * cosTilt - z3d * sinTilt;
                    const zTilted = y3d * sinTilt + z3d * cosTilt;
                    y3d = yTilted;
                    z3d = zTilted;

                    // 应用整体旋转（绕Y轴）
                    const cosRot = Math.cos(globalRotation);
                    const sinRot = Math.sin(globalRotation);
                    const xRot = x3d * cosRot + z3d * sinRot;
                    const zRot = -x3d * sinRot + z3d * cosRot;
                    x3d = xRot;
                    z3d = zRot;

                    // 投影
                    const scale = 1 / (1 + z3d * perspective);
                    const sx = w / 2 + x3d * scale;
                    const sy = h / 2 + y3d * scale;

                    // 深度因子（近大远小，近亮远暗）
                    const depthFactor = 1 - Math.max(0, Math.min(1, (z3d + depthRange) / (2 * depthRange)));
                    const sizeScale = 0.5 + depthFactor * 1.5;
                    const alphaScale = 0.35 + depthFactor * 0.85;

                    // 闪烁
                    const flash = 0.65 + 0.35 * Math.sin(t / 1000 * Math.PI * 2 * p.flashSpeed / 5 + p.flashOffset);

                    projected.push({
                        sx,
                        sy,
                        z: z3d,
                        size: p.size * sizeScale,
                        alpha: p.alphaBase * alphaScale * flash,
                        hue: p.hue,
                        sat: p.sat,
                        light: p.light,
                        layer: p.layer,
                    });
                }

                // 绘制粒子连线（距离阈值）
                const connectThreshold = 95;
                const connectAlpha = 0.35;
                ctx.lineWidth = 0.7;
                for (let i = 0; i < projected.length; i++) {
                    for (let j = i + 1; j < projected.length; j++) {
                        const dx = projected[i].sx - projected[j].sx;
                        const dy = projected[i].sy - projected[j].sy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < connectThreshold) {
                            const a = connectAlpha * (1 - dist / connectThreshold) *
                                Math.min(projected[i].alpha, projected[j].alpha);
                            if (a > 0.04) {
                                const midHue = (projected[i].hue + projected[j].hue) / 2;
                                ctx.strokeStyle = hslToCss(midHue, 55, 70, a);
                                ctx.beginPath();
                                ctx.moveTo(projected[i].sx, projected[i].sy);
                                ctx.lineTo(projected[j].sx, projected[j].sy);
                                ctx.stroke();
                            }
                        }
                    }
                }

                // 绘制粒子（带发光效果）
                for (const pp of projected) {
                    const { sx, sy, size, alpha, hue, sat, light } = pp;
                    if (alpha < 0.02) continue;

                    // 大粒子光晕
                    if (size > 2.5) {
                        const glowR = size * 5;
                        const glowGrad = createRadialGradient(ctx, sx, sy, glowR, [
                            { pos: 0, color: hslToCss(hue, sat, light, alpha * 0.35) },
                            { pos: 0.4, color: hslToCss(hue, sat, light, alpha * 0.12) },
                            { pos: 1, color: hslToCss(hue, sat, light, 0) },
                        ]);
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(sx, sy, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 粒子核心
                    ctx.fillStyle = hslToCss(hue, sat + 10, light + 12, Math.min(1, alpha * 1.4));
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();

                    // 高光
                    if (size > 2) {
                        ctx.fillStyle = `rgba(255,255,250,${Math.min(0.7, alpha * 0.5)})`;
                        ctx.beginPath();
                        ctx.arc(sx - size * 0.25, sy - size * 0.25, size * 0.4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 绘制轨道环提示（微弱的椭圆线条）
                for (const layer of T2_LAYERS) {
                    const r = layer.radius;
                    const tilt = layer.tilt * Math.PI / 180;
                    const cosT = Math.cos(tilt);
                    const sinT = Math.sin(tilt);
                    ctx.save();
                    ctx.translate(w / 2, h / 2);
                    ctx.rotate(globalRotation);
                    ctx.scale(1, cosT);
                    ctx.strokeStyle = `rgba(140,160,200,${0.05 + 0.03 * Math.sin(t / 1000 * Math.PI * 2 + layer.tilt)})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 底部光晕
                const bottomGlow = ctx.createRadialGradient(w / 2, h, 100, w / 2, h, 600);
                bottomGlow.addColorStop(0, 'rgba(40,50,90,0.15)');
                bottomGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = bottomGlow;
                ctx.fillRect(0, 0, w, h);
            }

            // --- T3 渲染 (15秒) ---
            function renderT3(timeMs, ctx) {
                const w = T3_W,
                    h = T3_H;
                const t = Math.max(0, Math.min(timeMs, T3_DURATION));
                const progress = t / T3_DURATION; // 0..1

                // 清屏
                ctx.fillStyle = '#03050a';
                ctx.fillRect(0, 0, w, h);

                // 背景渐变
                const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 60, w / 2, h / 2, 1100);
                bgGrad.addColorStop(0, '#0c1528');
                bgGrad.addColorStop(0.5, '#070d1c');
                bgGrad.addColorStop(1, '#020308');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // 背景星点
                for (const star of t3Stars) {
                    const twinkle = 0.5 + 0.5 * Math.sin(t / 1000 * Math.PI * 2 * star.twinkleSpeed / 6 + star
                        .twinkleOffset);
                    const alpha = star.alpha * (0.35 + 0.65 * twinkle);
                    ctx.fillStyle = `rgba(210,220,245,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 阶段定义（15秒弧线）
                // 阶段0 (0-2.5s): 形成 - 粒子从中心向外扩散
                // 阶段1 (2.5-5s): 旋转稳定
                // 阶段2 (5-8s): 膨胀，色彩暖化
                // 阶段3 (8-11.5s): 收缩，色彩冷化
                // 阶段4 (11.5-15s): 最终稳定
                const phaseTimes = {
                    form: 2500,
                    stable: 5000,
                    expand: 8000,
                    contract: 11500,
                    final: 15000,
                };

                let scaleFactor = 1.0;
                let rotationSpeed = 2.2;
                let armTightness = 0.55;
                let hueShift = 0;

                if (t < phaseTimes.form) {
                    const p = t / phaseTimes.form;
                    const eased = easeInOutCubic(p);
                    scaleFactor = lerp(0.15, 1.0, eased);
                    rotationSpeed = lerp(0.5, 2.2, eased);
                    armTightness = lerp(1.5, 0.55, eased);
                    hueShift = lerp(80, 0, eased);
                } else if (t < phaseTimes.stable) {
                    const p = (t - phaseTimes.form) / (phaseTimes.stable - phaseTimes.form);
                    scaleFactor = lerp(1.0, 1.08, easeInOutCubic(p));
                    rotationSpeed = lerp(2.2, 2.0, p);
                    armTightness = lerp(0.55, 0.52, p);
                    hueShift = lerp(0, 10, p);
                } else if (t < phaseTimes.expand) {
                    const p = (t - phaseTimes.stable) / (phaseTimes.expand - phaseTimes.stable);
                    const eased = easeInOutCubic(p);
                    scaleFactor = lerp(1.08, 1.55, eased);
                    rotationSpeed = lerp(2.0, 1.55, eased);
                    armTightness = lerp(0.52, 0.38, eased);
                    hueShift = lerp(10, 55, eased);
                } else if (t < phaseTimes.contract) {
                    const p = (t - phaseTimes.expand) / (phaseTimes.contract - phaseTimes.expand);
                    const eased = easeInOutCubic(p);
                    scaleFactor = lerp(1.55, 0.72, eased);
                    rotationSpeed = lerp(1.55, 2.8, eased);
                    armTightness = lerp(0.38, 0.82, eased);
                    hueShift = lerp(55, 115, eased);
                } else {
                    const p = (t - phaseTimes.contract) / (phaseTimes.final - phaseTimes.contract);
                    const eased = easeInOutCubic(p);
                    scaleFactor = lerp(0.72, 1.12, eased);
                    rotationSpeed = lerp(2.8, 1.6, eased);
                    armTightness = lerp(0.82, 0.50, eased);
                    hueShift = lerp(115, 90, eased);
                }

                const totalRotation = progress * Math.PI * 2 * rotationSpeed * 1.6;
                const effectiveScale = scaleFactor;

                // 计算粒子位置
                const projected = [];
                const perspective = 0.0011;

                for (const p of t3Particles) {
                    // 实际半径（受臂紧密度影响）
                    const normalizedRadius = (p.baseRadius - 40) / 500;
                    const rEff = 40 + normalizedRadius * 500 * armTightness * 0.85;
                    const radius = rEff * effectiveScale;

                    // 噪声扰动
                    const noiseAngle = Math.sin(t / 1000 * 1.3 + p.noiseSeed) * 0.06;
                    const noiseRadius = Math.cos(t / 1000 * 0.9 + p.noiseSeed * 1.7) * 22 * effectiveScale;

                    // 角度
                    const angle = p.theta + p.angleOffset + totalRotation * (1 - normalizedRadius * 0.55) + noiseAngle;
                    const r = Math.max(5, radius + noiseRadius);

                    // 3D位置
                    const x3d = Math.cos(angle) * r;
                    const z3d = Math.sin(angle) * r * 0.6;
                    const y3d = Math.sin(angle * 0.7 + p.noiseSeed) * r * 0.35 + (p.noiseSeed - 0.5) * 40;

                    // 投影
                    const scale = 1 / (1 + z3d * perspective);
                    const sx = w / 2 + x3d * scale;
                    const sy = h / 2 + y3d * scale;

                    const depthFactor = 1 - Math.max(0, Math.min(1, (z3d + 400) / 800));
                    const sizeScale = 0.45 + depthFactor * 1.6;
                    const alphaScale = 0.3 + depthFactor * 0.9;

                    const flash = 0.7 + 0.3 * Math.sin(t / 1000 * Math.PI * 2 * 3 + p.noiseSeed);

                    projected.push({
                        sx,
                        sy,
                        z: z3d,
                        size: p.size * sizeScale,
                        alpha: p.alphaBase * alphaScale * flash,
                        hue: (p.hue + hueShift) % 360,
                        sat: p.sat,
                        light: p.light,
                    });
                }

                // 绘制连线
                const connectThreshold = 105;
                const connectAlpha = 0.28;
                ctx.lineWidth = 0.6;
                for (let i = 0; i < projected.length; i++) {
                    for (let j = i + 1; j < projected.length; j++) {
                        const dx = projected[i].sx - projected[j].sx;
                        const dy = projected[i].sy - projected[j].sy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < connectThreshold) {
                            const a = connectAlpha * (1 - dist / connectThreshold) *
                                Math.min(projected[i].alpha, projected[j].alpha);
                            if (a > 0.03) {
                                const midHue = (projected[i].hue + projected[j].hue) / 2;
                                ctx.strokeStyle = hslToCss(midHue, 60, 72, a);
                                ctx.beginPath();
                                ctx.moveTo(projected[i].sx, projected[i].sy);
                                ctx.lineTo(projected[j].sx, projected[j].sy);
                                ctx.stroke();
                            }
                        }
                    }
                }

                // 绘制粒子
                for (const pp of projected) {
                    const { sx, sy, size, alpha, hue, sat, light } = pp;
                    if (alpha < 0.025) continue;

                    if (size > 2.2) {
                        const glowR = size * 4.5;
                        const glowGrad = createRadialGradient(ctx, sx, sy, glowR, [
                            { pos: 0, color: hslToCss(hue, sat, light, alpha * 0.3) },
                            { pos: 0.45, color: hslToCss(hue, sat, light, alpha * 0.08) },
                            { pos: 1, color: hslToCss(hue, sat, light, 0) },
                        ]);
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(sx, sy, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = hslToCss(hue, sat + 8, light + 10, Math.min(1, alpha * 1.35));
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();

                    if (size > 1.8) {
                        ctx.fillStyle = `rgba(255,255,248,${Math.min(0.6, alpha * 0.45)})`;
                        ctx.beginPath();
                        ctx.arc(sx - size * 0.2, sy - size * 0.2, size * 0.38, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 中心光晕
                const centerPulse = 0.5 + 0.5 * Math.sin(t / 1000 * Math.PI * 2 * 2.5);
                const centerGlow = createRadialGradient(ctx, w / 2, h / 2, centerPulse * 80, [
                    { pos: 0, color: `rgba(255,240,210,${0.3 + centerPulse * 0.25})` },
                    { pos: 0.3, color: `rgba(220,190,130,${0.15 + centerPulse * 0.1})` },
                    { pos: 1, color: 'rgba(120,80,40,0)' },
                ]);
                ctx.fillStyle = centerGlow;
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, centerPulse * 80 + 60, 0, Math.PI * 2);
                ctx.fill();

                // 顶部光晕
                const topGlow = ctx.createRadialGradient(w / 2, 0, 80, w / 2, 0, 500);
                topGlow.addColorStop(0, 'rgba(60,70,120,0.12)');
                topGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = topGlow;
                ctx.fillRect(0, 0, w, h);
            }

            // --- T1 渲染 (静态) ---
            function renderT1(ctx) {
                const w = T1_W,
                    h = T1_H;

                // 背景
                const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
                bgGrad.addColorStop(0, '#0a0f1e');
                bgGrad.addColorStop(0.35, '#080d18');
                bgGrad.addColorStop(0.65, '#060a12');
                bgGrad.addColorStop(1, '#030509');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // 背景星点
                for (let i = 0; i < 350; i++) {
                    const sx = t1RNG() * w;
                    const sy = t1RNG() * h;
                    const alpha = 0.08 + t1RNG() * 0.4;
                    const size = 0.4 + t1RNG() * 1.6;
                    ctx.fillStyle = `rgba(200,215,240,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 重新生成T1星点（使用固定种子以保持确定性）
                const t1StarRNG = mulberry32(hashSeed('T1_stars'));
                for (let i = 0; i < 350; i++) {
                    const sx = t1StarRNG() * w;
                    const sy = t1StarRNG() * h;
                    const alpha = 0.08 + t1StarRNG() * 0.4;
                    const size = 0.4 + t1StarRNG() * 1.6;
                    ctx.fillStyle = `rgba(200,215,240,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 中央发光区域
                const centerGlow = createRadialGradient(ctx, T1_CENTER_X, T1_CENTER_Y, 20, T1_CENTER_X, T1_CENTER_Y, 500,
                    [
                        { pos: 0, color: 'rgba(255,235,200,0.5)' },
                        { pos: 0.15, color: 'rgba(240,200,140,0.22)' },
                        { pos: 0.5, color: 'rgba(180,130,80,0.07)' },
                        { pos: 1, color: 'rgba(0,0,0,0)' },
                    ]);
                ctx.fillStyle = centerGlow;
                ctx.beginPath();
                ctx.arc(T1_CENTER_X, T1_CENTER_Y, 500, 0, Math.PI * 2);
                ctx.fill();

                // 连线
                ctx.lineWidth = 0.8;
                for (const [p1, p2] of t1Connections) {
                    const dist = Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
                    if (dist < 200) {
                        const alpha = 0.25 * (1 - dist / 200) * Math.min(p1.alpha, p2.alpha);
                        if (alpha > 0.03) {
                            const midHue = (p1.hue + p2.hue) / 2;
                            ctx.strokeStyle = hslToCss(midHue, 55, 68, alpha);
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                // 粒子
                for (const p of t1Particles) {
                    const { x, y, size, alpha, hue, sat, light } = p;

                    if (size > 3) {
                        const glowR = size * 4;
                        const glowGrad = createRadialGradient(ctx, x, y, glowR, [
                            { pos: 0, color: hslToCss(hue, sat, light, alpha * 0.3) },
                            { pos: 0.4, color: hslToCss(hue, sat, light, alpha * 0.1) },
                            { pos: 1, color: hslToCss(hue, sat, light, 0) },
                        ]);
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(x, y, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = hslToCss(hue, sat + 10, light + 10, Math.min(1, alpha * 1.3));
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();

                    if (size > 2) {
                        ctx.fillStyle = `rgba(255,255,250,${Math.min(0.7, alpha * 0.5)})`;
                        ctx.beginPath();
                        ctx.arc(x - size * 0.2, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 装饰性底部元素
                const bottomY = h * 0.78;
                const lineGrad = ctx.createLinearGradient(w * 0.2, 0, w * 0.8, 0);
                lineGrad.addColorStop(0, 'rgba(232,200,119,0)');
                lineGrad.addColorStop(0.3, 'rgba(232,200,119,0.5)');
                lineGrad.addColorStop(0.7, 'rgba(232,200,119,0.5)');
                lineGrad.addColorStop(1, 'rgba(232,200,119,0)');
                ctx.fillStyle = lineGrad;
                ctx.fillRect(w * 0.2, bottomY, w * 0.6, 2);

                // 底部文字
                ctx.fillStyle = 'rgba(200,210,240,0.7)';
                ctx.font = '500 38px "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('星 辉 · 粒 子 交 响 曲', w / 2, bottomY + 80);

                ctx.fillStyle = 'rgba(170,185,220,0.45)';
                ctx.font = '400 24px "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
                ctx.fillText('T1 · 静 态 海 报 · 1080×2340', w / 2, bottomY + 140);

                // 侧边装饰粒子
                const sideParticles = [
                    { x: 95, y: 260, size: 4.5, hue: 40, alpha: 0.85 },
                    { x: 985, y: 180, size: 5.2, hue: 210, alpha: 0.8 },
                    { x: 70, y: 420, size: 3.2, hue: 200, alpha: 0.7 },
                    { x: 1010, y: 380, size: 3.8, hue: 35, alpha: 0.75 },
                    { x: 120, y: 560, size: 2.8, hue: 50, alpha: 0.65 },
                    { x: 960, y: 520, size: 3.5, hue: 220, alpha: 0.7 },
                    { x: 85, y: 700, size: 2.2, hue: 190, alpha: 0.55 },
                    { x: 995, y: 660, size: 2.6, hue: 45, alpha: 0.6 },
                ];
                for (const sp of sideParticles) {
                    const sg = createRadialGradient(ctx, sp.x, sp.y, sp.size * 3, [
                        { pos: 0, color: hslToCss(sp.hue, 70, 65, sp.alpha * 0.5) },
                        { pos: 1, color: hslToCss(sp.hue, 70, 65, 0) },
                    ]);
                    ctx.fillStyle = sg;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = hslToCss(sp.hue, 75, 70, sp.alpha);
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ==================== 画布CSS缩放 ====================

            function fitCanvas(canvas, targetRatio) {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const canvasRatio = targetRatio;
                const viewportRatio = vw / vh;

                let cssW, cssH;
                if (canvasRatio > viewportRatio) {
                    cssW = vw;
                    cssH = vw / canvasRatio;
                } else {
                    cssH = vh;
                    cssW = vh * canvasRatio;
                }

                // 留出控制栏空间
                const maxH = vh - 60;
                const maxW = vw - 20;
                if (cssH > maxH) {
                    cssH = maxH;
                    cssW = cssH * canvasRatio;
                }
                if (cssW > maxW) {
                    cssW = maxW;
                    cssH = cssW / canvasRatio;
                }

                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
            }

            function fitAllCanvases() {
                fitCanvas(canvasT1, T1_W / T1_H);
                fitCanvas(canvasT2, T2_W / T2_H);
                fitCanvas(canvasT3, T3_W / T3_H);
            }

            // ==================== 动画循环 ====================

            function renderCurrentFrame() {
                if (currentMode === 't2') {
                    renderT2(currentTime % T2_DURATION, ctxT2);
                } else if (currentMode === 't3') {
                    renderT3(Math.min(currentTime, T3_DURATION), ctxT3);
                }
                updateProgressBar();
            }

            function animate(timestamp) {
                if (lastFrameTime !== null && isPlaying) {
                    const delta = timestamp - lastFrameTime;
                    currentTime += delta;
                    // 防止时间无限增长
                    if (currentTime > 600000) currentTime = currentTime % 600000;
                }
                lastFrameTime = timestamp;

                renderCurrentFrame();
                animFrameId = requestAnimationFrame(animate);
            }

            function startAnimation() {
                if (animFrameId === null) {
                    lastFrameTime = null;
                    animFrameId = requestAnimationFrame(animate);
                }
            }

            function stopAnimation() {
                if (animFrameId !== null) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
            }

            // ==================== UI交互 ====================

            function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;

                // 切换画布可见性
                canvasT1.classList.toggle('hidden-canvas', mode !== 't1');
                canvasT2.classList.toggle('hidden-canvas', mode !== 't2');
                canvasT3.classList.toggle('hidden-canvas', mode !== 't3');

                // 更新按钮状态
                document.querySelectorAll('#controls .btn[data-mode]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });

                // 设置时间范围
                const totalLabel = document.getElementById('timeTotal');
                if (mode === 't1') {
                    totalLabel.textContent = '—';
                    document.getElementById('progressBar').style.opacity = '0.4';
                } else {
                    document.getElementById('progressBar').style.opacity = '1';
                    if (mode === 't2') {
                        totalLabel.textContent = '10.0s';
                    } else {
                        totalLabel.textContent = '15.0s';
                    }
                }

                // 渲染对应画面
                if (mode === 't1') {
                    renderT1(ctxT1);
                } else if (mode === 't2') {
                    renderT2(currentTime % T2_DURATION, ctxT2);
                } else {
                    renderT3(Math.min(currentTime, T3_DURATION), ctxT3);
                }
                updateProgressBar();
            }

            function togglePlay() {
                isPlaying = !isPlaying;
                const btn = document.getElementById('btnPlay');
                btn.textContent = isPlaying ? '⏸' : '▶';
                if (isPlaying) {
                    lastFrameTime = null;
                    startAnimation();
                } else {
                    stopAnimation();
                }
            }

            function updateProgressBar() {
                const fill = document.getElementById('progressFill');
                const timeLabel = document.getElementById('timeCurrent');
                const totalLabel = document.getElementById('timeTotal');

                if (currentMode === 't1') {
                    fill.style.width = '0%';
                    timeLabel.textContent = '—';
                    return;
                }

                const duration = currentMode === 't2' ? T2_DURATION : T3_DURATION;
                const t = Math.min(currentTime, duration);
                const pct = (t / duration) * 100;

                fill.style.width = pct + '%';
                timeLabel.textContent = (t / 1000).toFixed(1) + 's';
                totalLabel.textContent = (duration / 1000).toFixed(1) + 's';
            }

            function handleProgressClick(e) {
                if (currentMode === 't1') return;
                const track = document.getElementById('progressTrack');
                const rect = track.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const pct = Math.max(0, Math.min(1, x / rect.width));
                const duration = currentMode === 't2' ? T2_DURATION : T3_DURATION;
                window.__seek(pct * duration);
                // 保持暂停状态
                isPlaying = false;
                document.getElementById('btnPlay').textContent = '▶';
                stopAnimation();
                updateProgressBar();
            }

            // ==================== window.__seek ====================

            window.__seek = function(ms) {
                ms = Number(ms);
                if (!isFinite(ms) || ms < 0) ms = 0;

                currentTime = ms;
                isPlaying = false;
                const btn = document.getElementById('btnPlay');
                btn.textContent = '▶';
                stopAnimation();

                // 立即渲染对应帧
                if (currentMode === 't2') {
                    renderT2(ms % T2_DURATION, ctxT2);
                } else if (currentMode === 't3') {
                    renderT3(Math.min(ms, T3_DURATION), ctxT3);
                }
                updateProgressBar();
            };

            // ==================== 事件绑定 ====================

            function bindEvents() {
                // 模式切换
                document.querySelectorAll('#controls .btn[data-mode]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        setMode(btn.dataset.mode);
                    });
                });

                // 播放/暂停
                document.getElementById('btnPlay').addEventListener('click', togglePlay);

                // 进度条点击
                document.getElementById('progressTrack').addEventListener('click', handleProgressClick);

                // 键盘快捷键
                window.addEventListener('keydown', (e) => {
                    if (e.key === '1') setMode('t1');
                    if (e.key === '2') setMode('t2');
                    if (e.key === '3') setMode('t3');
                    if (e.key === ' ') {
                        e.preventDefault();
                        togglePlay();
                    }
                    if (e.key === 'ArrowRight') {
                        const duration = currentMode === 't2' ? T2_DURATION : T3_DURATION;
                        window.__seek(Math.min(currentTime + 200, duration));
                    }
                    if (e.key === 'ArrowLeft') {
                        window.__seek(Math.max(currentTime - 200, 0));
                    }
                });

                // 窗口大小变化
                let resizeTimer = null;
                window.addEventListener('resize', () => {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        fitAllCanvases();
                        renderCurrentFrame();
                    }, 80);
                });
            }

            // ==================== 初始化 ====================

            function init() {
                fitAllCanvases();
                bindEvents();

                // 初始渲染
                renderT1(ctxT1);
                renderT2(0, ctxT2);
                renderT3(0, ctxT3);

                // 启动动画
                currentMode = 't2';
                isPlaying = true;
                document.getElementById('btnPlay').textContent = '⏸';
                startAnimation();

                console.log('⭐ 星辉·粒子交响曲 已加载');
                console.log('T1: 静态海报 | T2: 10秒循环动画 | T3: 15秒动画');
                console.log('按 1/2/3 切换画面 | 空格键 播放/暂停 | 方向键 微调时间');
                console.log('window.__seek(ms) 可跳转至指定毫秒');
            }

            // 页面加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
