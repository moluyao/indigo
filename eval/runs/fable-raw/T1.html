<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>暮山 · 手机壁纸 1080×2340</title>
<style>
  html,body{margin:0;padding:0;background:#05060f}
  body{width:1080px;height:2340px;overflow:hidden}
  canvas{display:block;width:1080px;height:2340px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="2340"></canvas>
<script>
(function(){
  const W = 1080, H = 2340;
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const R = mulberry32(20261117);

  // 1D value noise + fbm
  const NT = new Float32Array(4096);
  { const r = mulberry32(911); for (let i=0;i<4096;i++) NT[i]=r(); }
  function vn(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return NT[i&4095]*(1-u)+NT[(i+1)&4095]*u;}
  function fbm(x,oct){let s=0,a=.5,f=1,n=0;for(let o=0;o<oct;o++){s+=a*vn(x*f+o*37.13);n+=a;a*=.5;f*=2.07;}return s/n;}

  const mix=(a,b,p)=>a+(b-a)*p;
  const mixC=(c1,c2,p)=>[mix(c1[0],c2[0],p),mix(c1[1],c2[1],p),mix(c1[2],c2[2],p)];
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  // ---------- Sky ----------
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0.00,'#060818');
  sky.addColorStop(0.18,'#0d1433');
  sky.addColorStop(0.36,'#1d2353');
  sky.addColorStop(0.50,'#3a3470');
  sky.addColorStop(0.58,'#6a4680');
  sky.addColorStop(0.64,'#a85e83');
  sky.addColorStop(0.675,'#dc7f7f');
  sky.addColorStop(0.695,'#f4a585');
  sky.addColorStop(0.712,'#ffcf9f');
  sky.addColorStop(0.73,'#ffe2b8');
  sky.addColorStop(1.00,'#ffe2b8');
  g.fillStyle = sky; g.fillRect(0,0,W,H);

  const SUN = {x:648, y:1655, r:92};

  // wide atmospheric glow
  let rg = g.createRadialGradient(SUN.x,SUN.y,0,SUN.x,SUN.y,1150);
  rg.addColorStop(0,'rgba(255,196,150,0.55)');
  rg.addColorStop(0.25,'rgba(255,150,130,0.22)');
  rg.addColorStop(0.6,'rgba(170,90,140,0.08)');
  rg.addColorStop(1,'rgba(120,60,140,0)');
  g.fillStyle = rg; g.fillRect(0,0,W,H);

  // ---------- Stars ----------
  for (let i=0;i<420;i++){
    const y = H*0.56*Math.pow(R(),1.7);
    const x = R()*W;
    const fade = Math.max(0,1 - y/1310);
    const a = (0.25 + 0.75*R())*fade*fade;
    const s = 0.5 + Math.pow(R(),3)*1.9;
    g.fillStyle = `rgba(255,${(235+R()*20)|0},${(220+R()*35)|0},${a.toFixed(3)})`;
    g.beginPath(); g.arc(x,y,s,0,Math.PI*2); g.fill();
  }
  // a handful of brighter stars with halos
  for (let i=0;i<9;i++){
    const x = 80+R()*920, y = 120+R()*820, a = 0.5+R()*0.4;
    const h = g.createRadialGradient(x,y,0,x,y,22);
    h.addColorStop(0,`rgba(255,245,230,${a})`); h.addColorStop(0.15,`rgba(255,235,215,${a*0.35})`); h.addColorStop(1,'rgba(255,230,210,0)');
    g.fillStyle = h; g.fillRect(x-22,y-22,44,44);
    g.fillStyle = `rgba(255,250,240,${a})`; g.beginPath(); g.arc(x,y,1.6,0,Math.PI*2); g.fill();
  }

  // ---------- Cloud streaks ----------
  function streak(cx,cy,w,h,col,a){
    g.save(); g.translate(cx,cy); g.scale(w/h,1);
    const q = g.createRadialGradient(0,0,0,0,0,h);
    q.addColorStop(0,rgba(col,a)); q.addColorStop(0.55,rgba(col,a*0.45)); q.addColorStop(1,rgba(col,0));
    g.fillStyle = q; g.beginPath(); g.arc(0,0,h,0,Math.PI*2); g.fill(); g.restore();
  }
  for (let i=0;i<5;i++) streak(R()*W, 1040+R()*220, 260+R()*380, 9+R()*12, [60,44,96], 0.35);
  for (let i=0;i<9;i++) streak(R()*W, 1330+R()*250, 220+R()*520, 6+R()*14, [255,178,160], 0.22+R()*0.18);
  for (let i=0;i<4;i++) streak(SUN.x+(R()-.5)*600, 1520+R()*80, 300+R()*300, 4+R()*5, [255,226,190], 0.35);

  // ---------- Sun ----------
  rg = g.createRadialGradient(SUN.x,SUN.y,SUN.r*0.6,SUN.x,SUN.y,SUN.r*3.2);
  rg.addColorStop(0,'rgba(255,236,200,0.75)'); rg.addColorStop(0.35,'rgba(255,200,150,0.25)'); rg.addColorStop(1,'rgba(255,170,130,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(SUN.x,SUN.y,SUN.r*3.2,0,Math.PI*2); g.fill();
  rg = g.createRadialGradient(SUN.x,SUN.y-20,0,SUN.x,SUN.y,SUN.r);
  rg.addColorStop(0,'#fffaf0'); rg.addColorStop(0.7,'#ffeccc'); rg.addColorStop(1,'#ffd9a6');
  g.fillStyle = rg; g.beginPath(); g.arc(SUN.x,SUN.y,SUN.r,0,Math.PI*2); g.fill();

  // birds
  g.strokeStyle='rgba(40,24,50,0.75)'; g.lineWidth=2.2; g.lineCap='round'; g.lineJoin='round';
  [[402,1372,13],[436,1352,10],[378,1398,8],[462,1384,7]].forEach(([x,y,s])=>{
    g.beginPath(); g.moveTo(x-s,y-s*0.35); g.quadraticCurveTo(x-s*0.4,y-s*0.55,x,y); g.quadraticCurveTo(x+s*0.4,y-s*0.55,x+s,y-s*0.35); g.stroke();
  });

  // ---------- Mountain layers ----------
  const L = 9;
  const FAR = [226,150,146], MID = [108,66,110], NEAR = [16,12,28];
  const HAZE = [246,180,156];
  for (let k=0;k<L;k++){
    const tk = k/(L-1);
    const base = 1650 + Math.pow(tk,1.3)*610;
    const amp  = 55 + tk*tk*230 + tk*60;
    const freq = 1/(300 + tk*620);
    const col = tk<0.5 ? mixC(FAR,MID,tk/0.5) : mixC(MID,NEAR,(tk-0.5)/0.5);
    const off = k*113.7;
    const pts = [];
    for (let x=-12;x<=W+12;x+=3){
      const n1 = fbm(x*freq+off,5);
      const rd = 1-Math.abs(2*fbm(x*freq*1.8+off+50,4)-1);
      const h  = 0.58*n1 + 0.42*rd*rd;
      pts.push([x, base - amp*h]);
    }
    g.beginPath(); g.moveTo(-12,H);
    for (const p of pts) g.lineTo(p[0],p[1]);
    g.lineTo(W+12,H); g.closePath();
    // vertical gradient inside the layer: slightly lighter at the crest
    const top = base-amp;
    const lg = g.createLinearGradient(0,top,0,base+amp*0.6);
    lg.addColorStop(0,rgba(mixC(col,HAZE,0.10*(1-tk)),1));
    lg.addColorStop(1,rgba(col,1));
    g.fillStyle = lg; g.fill();

    // rim light along crests facing the sun
    if (k<5){
      g.save();
      g.beginPath(); for (let i=0;i<pts.length;i++){const p=pts[i]; i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);}
      const rim = g.createLinearGradient(SUN.x-700,0,SUN.x+700,0);
      const ra = 0.42*(1-k/5);
      rim.addColorStop(0,'rgba(255,214,175,0)'); rim.addColorStop(0.5,`rgba(255,226,190,${ra})`); rim.addColorStop(1,'rgba(255,214,175,0)');
      g.strokeStyle = rim; g.lineWidth = 1.6; g.stroke(); g.restore();
    }

    // valley mist
    if (k<L-1){
      const y0 = base - amp*0.25, y1 = base + 90 + tk*60;
      const ma = 0.55*Math.pow(1-tk,1.1);
      const mc = mixC(HAZE,[150,96,140],tk);
      const mg = g.createLinearGradient(0,y0,0,y1);
      mg.addColorStop(0,rgba(mc,0)); mg.addColorStop(1,rgba(mc,ma));
      g.fillStyle = mg; g.fillRect(0,y0,W,H-y0);
      // drifting mist bands
      for (let j=0;j<3;j++) streak(R()*W, base+20+R()*50, 260+R()*360, 10+R()*14, mc, ma*0.55);
    }
  }

  // ---------- Vignette ----------
  rg = g.createRadialGradient(W*0.55,H*0.62,500,W*0.5,H*0.55,1650);
  rg.addColorStop(0,'rgba(4,4,14,0)'); rg.addColorStop(1,'rgba(4,4,14,0.42)');
  g.fillStyle = rg; g.fillRect(0,0,W,H);

  // ---------- Film grain ----------
  const img = g.getImageData(0,0,W,H), d = img.data;
  let s = 1234567;
  for (let i=0;i<d.length;i+=4){
    s = (s*1664525 + 1013904223)>>>0;
    const n = ((s>>>24)-128)*0.075;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  g.putImageData(img,0,0);
})();
</script>
</body>
</html>
